<!DOCTYPE html>
<html lang="kk" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMB Portal — курс</title>
  <meta name="theme-color" content="#090d16">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <style>
    html, body { height: 100%; }
    body { font-family: system-ui, sans-serif; }
  </style>
</head>
<body class="bg-[#090d16] text-slate-100 flex flex-col">
  <header class="h-11 shrink-0 flex items-center justify-between gap-3 px-3 bg-slate-900 border-b border-slate-800">
    <a href="index.html" id="backLink" class="text-xs font-bold text-cyan-300 hover:text-cyan-200"></a>
    <span id="courseName" class="text-xs font-black text-white truncate"></span>
    <span class="w-16"></span>
  </header>

  <div id="status" class="flex-1 flex items-center justify-center p-6 text-center text-sm font-bold text-slate-400"></div>
  <iframe id="frame" title="Курс" class="hidden flex-1 w-full border-0 bg-white" allow="fullscreen"></iframe>

  <script>
    (async function () {
      const { sb, t, courseTitle } = SMB;
      const status = document.getElementById('status');
      document.getElementById('backLink').textContent = t('back');
      document.documentElement.lang = SMB.getLang() === 'ru' ? 'ru' : 'kk';

      function fail(msg) {
        status.innerHTML = '';
        const p = document.createElement('p');
        p.textContent = msg;
        const a = document.createElement('a');
        a.href = 'index.html';
        a.className = 'inline-block mt-4 px-4 py-2 rounded-xl bg-cyan-500 text-slate-950 font-black';
        a.textContent = t('back');
        const box = document.createElement('div');
        box.append(p, a);
        status.append(box);
      }

      if (!SMB.configured) return fail(t('notConfigured'));
      status.textContent = t('loading');

      const user = await SMB.currentUser();
      if (!user) { location.replace('index.html'); return; }

      const slug = new URLSearchParams(location.search).get('c') || '';
      if (!/^[a-z0-9-]{2,40}$/.test(slug)) return fail(t('noAccess'));

      const { data: course } = await sb.from('courses').select('*').eq('slug', slug).maybeSingle();
      if (!course) return fail(t('noAccess'));
      document.getElementById('courseName').textContent = courseTitle(course);
      document.title = courseTitle(course) + ' — SMB Portal';

      // Файл отдаёт только хранилище, и только записанным на курс (правило в schema.sql).
      const { data: file, error } = await sb.storage.from(SMB.cfg.CONTENT_BUCKET || 'course-content')
        .download(slug + '/' + course.entry_file);
      if (error || !file) return fail(t('noAccess'));

      // Старые страницы курсов (geotanu.html, geonish.html) проверяют эту запись — даём им её.
      const profile = await SMB.loadProfile(user.id);
      try {
        localStorage.setItem('geotany_user_session', JSON.stringify({
          v: 2, role: 'student', email: user.email, name: (profile && profile.full_name) || '',
          courseCode: slug, courseId: slug, courseTitle: courseTitle(course), lang: SMB.getLang()
        }));
      } catch (e) {}

      const html = await file.text();
      const url = URL.createObjectURL(new Blob([html], { type: 'text/html;charset=utf-8' }));
      const frame = document.getElementById('frame');
      frame.src = url;
      frame.classList.remove('hidden');
      status.classList.add('hidden');
    })();
  </script>
</body>
</html>
