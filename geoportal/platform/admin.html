<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMB Portal — управление</title>
  <meta name="theme-color" content="#090d16">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; }
    .inp { width: 100%; padding: .5rem .75rem; background: #020617; border: 1px solid #334155; border-radius: .75rem; font-size: .8rem; color: #fff; }
    .inp:focus { outline: none; border-color: #22d3ee; }
    .lbl { display: block; font-size: 11px; font-weight: 700; color: #94a3b8; margin-bottom: .25rem; }
    .tab-on { background: #06b6d4; color: #020617; }
    .tab-off { background: #1e293b; color: #cbd5e1; }
  </style>
</head>
<body class="bg-[#090d16] text-slate-100 min-h-screen">
  <header class="sticky top-0 z-40 bg-slate-900/95 border-b border-slate-800">
    <div class="max-w-6xl mx-auto px-4 h-14 flex items-center justify-between gap-3">
      <div class="flex items-center gap-2">
        <span class="text-xl">👑</span>
        <span class="font-black text-white">SMB Portal — управление</span>
      </div>
      <div class="flex items-center gap-2 text-xs font-bold">
        <span id="whoami" class="hidden sm:inline text-slate-400"></span>
        <a href="index.html" class="px-3 py-1.5 rounded-xl bg-slate-800 text-slate-200">← Курсы</a>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-6 space-y-5">
    <div id="status" class="text-sm font-bold text-slate-400">Загрузка…</div>

    <div id="adminApp" class="hidden space-y-5">
      <nav class="flex flex-wrap gap-2 text-xs font-black" role="tablist">
        <button data-tab="requests" class="px-3.5 py-2 rounded-xl">📨 Запросы <span id="reqCount" class="ml-1 px-1.5 rounded bg-rose-500 text-white">0</span></button>
        <button data-tab="codes" class="px-3.5 py-2 rounded-xl">🔑 Коды</button>
        <button data-tab="students" class="px-3.5 py-2 rounded-xl">👥 Ученики</button>
        <button data-tab="courses" class="px-3.5 py-2 rounded-xl">📚 Курсы</button>
      </nav>

      <!-- Запросы -->
      <section data-panel="requests" class="space-y-3">
        <div id="requestsList" class="space-y-2"></div>
      </section>

      <!-- Коды -->
      <section data-panel="codes" class="hidden space-y-4">
        <form id="codeForm" class="p-4 rounded-2xl bg-slate-900 border border-amber-500/30 grid sm:grid-cols-6 gap-3 items-end">
          <div class="sm:col-span-2"><label class="lbl" for="cfCourse">Курс</label><select id="cfCourse" class="inp" required></select></div>
          <div class="sm:col-span-2"><label class="lbl" for="cfCode">Код</label>
            <div class="flex gap-1.5"><input id="cfCode" class="inp font-mono uppercase" required minlength="4" maxlength="40"><button type="button" id="cfGen" class="px-2.5 rounded-xl bg-slate-800 text-xs" title="Сгенерировать">🎲</button></div>
          </div>
          <div class="sm:col-span-2"><label class="lbl" for="cfLabel">Подпись (для кого)</label><input id="cfLabel" class="inp" maxlength="80" placeholder="11А, группа вечер…"></div>
          <div class="sm:col-span-2"><label class="lbl" for="cfMax">Макс. учеников (пусто = без лимита)</label><input id="cfMax" type="number" min="1" class="inp"></div>
          <div class="sm:col-span-2"><label class="lbl" for="cfExp">Действует до (необязательно)</label><input id="cfExp" type="date" class="inp"></div>
          <div class="sm:col-span-2"><button class="w-full py-2.5 rounded-xl bg-amber-400 text-slate-950 font-black text-sm">➕ Создать код</button></div>
        </form>
        <div class="overflow-x-auto rounded-2xl border border-slate-800">
          <table class="w-full text-xs text-left">
            <thead class="bg-slate-900 text-slate-400 uppercase text-[10px]"><tr>
              <th class="p-2.5">Код</th><th class="p-2.5">Курс</th><th class="p-2.5">Подпись</th><th class="p-2.5">Использован</th><th class="p-2.5">До</th><th class="p-2.5 text-right">Действия</th>
            </tr></thead>
            <tbody id="codesBody" class="divide-y divide-slate-800"></tbody>
          </table>
        </div>
      </section>

      <!-- Ученики -->
      <section data-panel="students" class="hidden space-y-3">
        <div class="flex flex-wrap gap-2">
          <input id="stSearch" class="inp max-w-xs" placeholder="Имя или почта…" aria-label="Поиск">
          <select id="stCourse" class="inp max-w-xs" aria-label="Курс"></select>
          <button id="stCsv" class="px-3 py-2 rounded-xl bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 text-xs font-bold">📥 CSV</button>
        </div>
        <div class="overflow-x-auto rounded-2xl border border-slate-800">
          <table class="w-full text-xs text-left">
            <thead class="bg-slate-900 text-slate-400 uppercase text-[10px]"><tr>
              <th class="p-2.5">Имя</th><th class="p-2.5">Почта</th><th class="p-2.5">Класс</th><th class="p-2.5">Курс</th><th class="p-2.5">Способ</th><th class="p-2.5">Дата</th><th class="p-2.5 text-right"></th>
            </tr></thead>
            <tbody id="studentsBody" class="divide-y divide-slate-800"></tbody>
          </table>
        </div>
      </section>

      <!-- Курсы -->
      <section data-panel="courses" class="hidden space-y-4">
        <form id="courseForm" class="p-4 rounded-2xl bg-slate-900 border border-cyan-500/30 grid sm:grid-cols-6 gap-3">
          <input type="hidden" id="coId">
          <div class="sm:col-span-2"><label class="lbl" for="coSlug">Адрес (латиница, напр. geotanu)</label><input id="coSlug" class="inp font-mono" required pattern="[a-z0-9\-]{2,40}"></div>
          <div><label class="lbl" for="coIcon">Иконка</label><input id="coIcon" class="inp" maxlength="4" value="📚"></div>
          <div><label class="lbl" for="coOrder">Порядок</label><input id="coOrder" type="number" class="inp" value="0"></div>
          <div class="sm:col-span-2"><label class="lbl" for="coEntry">Главный файл курса</label><input id="coEntry" class="inp font-mono" value="index.html" required></div>
          <div class="sm:col-span-3"><label class="lbl" for="coTitleKz">Название (KZ)</label><input id="coTitleKz" class="inp" required></div>
          <div class="sm:col-span-3"><label class="lbl" for="coTitleRu">Название (RU)</label><input id="coTitleRu" class="inp"></div>
          <div class="sm:col-span-3"><label class="lbl" for="coDescKz">Описание (KZ)</label><textarea id="coDescKz" rows="2" class="inp"></textarea></div>
          <div class="sm:col-span-3"><label class="lbl" for="coDescRu">Описание (RU)</label><textarea id="coDescRu" rows="2" class="inp"></textarea></div>
          <label class="sm:col-span-2 flex items-center gap-2 text-xs font-bold"><input type="checkbox" id="coPub" checked> Показывать в каталоге</label>
          <label class="sm:col-span-2 flex items-center gap-2 text-xs font-bold"><input type="checkbox" id="coReq" checked> Можно запросить доступ</label>
          <div class="sm:col-span-2 flex gap-2 justify-end">
            <button type="button" id="coReset" class="px-3 py-2 rounded-xl bg-slate-800 text-xs font-bold">Новый</button>
            <button class="px-4 py-2 rounded-xl bg-cyan-500 text-slate-950 text-xs font-black">💾 Сохранить курс</button>
          </div>
        </form>
        <div id="coursesList" class="grid sm:grid-cols-2 gap-3"></div>
      </section>
    </div>
  </main>

  <script>
    const { sb, esc, toast } = SMB;
    const BUCKET = SMB.cfg.CONTENT_BUCKET || 'course-content';
    let me = null, myProfile = null, courses = [], enrollments = [];

    const status = document.getElementById('status');
    const fmtDate = d => d ? new Date(d).toLocaleString('ru-RU', { dateStyle: 'short', timeStyle: 'short' }) : '—';
    const courseById = id => courses.find(c => c.id === id);
    const cTitle = c => c ? (c.title_ru || c.title_kz) : '—';
    const SOURCE = { code: '🔑 код', request: '📨 запрос', admin: '👑 вручную' };

    function genCode(prefix) {
      const abc = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
      const part = () => Array.from(crypto.getRandomValues(new Uint32Array(4)), n => abc[n % abc.length]).join('');
      return (prefix || 'SMB').toUpperCase().slice(0, 4) + '-' + part() + '-' + part();
    }

    // ---------- Вкладки ----------
    function showTab(name) {
      document.querySelectorAll('[data-tab]').forEach(b => b.className = 'px-3.5 py-2 rounded-xl ' + (b.dataset.tab === name ? 'tab-on' : 'tab-off'));
      document.querySelectorAll('[data-panel]').forEach(p => p.classList.toggle('hidden', p.dataset.panel !== name));
      ({ requests: loadRequests, codes: loadCodes, students: loadStudents, courses: renderCourses })[name]();
    }
    document.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));

    async function loadCourses() {
      // Админ видит все курсы, преподаватель — опубликованные и свои; управлять может только своими (это проверяет база).
      const { data } = await sb.from('courses').select('*').order('sort_order').order('created_at');
      courses = data || [];
      const opts = courses.map(c => `<option value="${esc(c.id)}">${esc(c.icon)} ${esc(cTitle(c))}</option>`).join('');
      document.getElementById('cfCourse').innerHTML = opts;
      document.getElementById('stCourse').innerHTML = '<option value="">Все курсы</option>' + opts;
    }

    // ---------- Запросы ----------
    async function loadRequests() {
      const box = document.getElementById('requestsList');
      const { data, error } = await sb.from('access_requests')
        .select('id, course_id, message, created_at, profiles!access_requests_user_id_fkey(full_name, email, grade)')
        .eq('status', 'pending').order('created_at');
      if (error) { box.textContent = 'Не удалось загрузить запросы.'; return; }
      document.getElementById('reqCount').textContent = data.length;
      if (!data.length) { box.innerHTML = '<p class="p-5 rounded-2xl border border-dashed border-slate-700 text-sm text-slate-400">Новых запросов нет.</p>'; return; }
      box.innerHTML = data.map(r => {
        const p = r.profiles || {};
        return `<div class="p-4 rounded-2xl bg-slate-900 border border-slate-800 flex flex-col sm:flex-row sm:items-center gap-3">
          <div class="flex-1 min-w-0 text-sm">
            <div class="font-black text-white">${esc(p.full_name || '(без имени)')} <span class="font-mono text-cyan-300 text-xs">${esc(p.email)}</span> ${p.grade ? `<span class="text-xs text-slate-400">· ${esc(p.grade)} кл.</span>` : ''}</div>
            <div class="text-xs text-slate-400">→ ${esc(cTitle(courseById(r.course_id)))} · ${fmtDate(r.created_at)}</div>
            ${r.message ? `<div class="mt-1 text-xs text-slate-300 italic">«${esc(r.message)}»</div>` : ''}
          </div>
          <div class="flex gap-2 shrink-0">
            <button data-decide="${esc(r.id)}" data-ok="1" class="px-3 py-2 rounded-xl bg-emerald-500 text-slate-950 text-xs font-black">✓ Принять</button>
            <button data-decide="${esc(r.id)}" data-ok="0" class="px-3 py-2 rounded-xl bg-rose-500/20 text-rose-300 text-xs font-bold">✕ Отклонить</button>
          </div>
        </div>`;
      }).join('');
    }
    document.getElementById('requestsList').addEventListener('click', async e => {
      const b = e.target.closest('[data-decide]');
      if (!b) return;
      b.disabled = true;
      const { data, error } = await sb.rpc('decide_request', { p_request: b.dataset.decide, p_approve: b.dataset.ok === '1' });
      if (error || !data || !data.ok) toast('Не получилось: ' + ((data && data.error) || (error && error.message)), true);
      else toast(b.dataset.ok === '1' ? 'Ученик добавлен на курс' : 'Запрос отклонён');
      loadRequests();
    });

    // ---------- Коды ----------
    async function loadCodes() {
      const { data, error } = await sb.from('access_codes').select('*').order('created_at', { ascending: false });
      const body = document.getElementById('codesBody');
      if (error) { body.innerHTML = '<tr><td colspan="6" class="p-4">Не удалось загрузить коды.</td></tr>'; return; }
      if (!data.length) { body.innerHTML = '<tr><td colspan="6" class="p-4 text-slate-400">Кодов пока нет.</td></tr>'; return; }
      body.innerHTML = data.map(c => {
        const expired = c.expires_at && new Date(c.expires_at) < new Date();
        const full = c.max_uses && c.uses >= c.max_uses;
        return `<tr class="${c.is_active && !expired && !full ? '' : 'opacity-50'}">
          <td class="p-2.5 font-mono font-black text-amber-300">${esc(c.code)}</td>
          <td class="p-2.5">${esc(cTitle(courseById(c.course_id)))}</td>
          <td class="p-2.5 text-slate-400">${esc(c.label || '')}</td>
          <td class="p-2.5">${c.uses}${c.max_uses ? ' / ' + c.max_uses : ''}</td>
          <td class="p-2.5 text-slate-400">${c.expires_at ? new Date(c.expires_at).toLocaleDateString('ru-RU') : '—'}</td>
          <td class="p-2.5 text-right whitespace-nowrap">
            <button data-copy="${esc(c.code)}" class="px-2 py-1 rounded-lg bg-slate-800">📋</button>
            <button data-toggle="${esc(c.id)}" data-active="${c.is_active ? 1 : 0}" class="px-2 py-1 rounded-lg bg-slate-800">${c.is_active ? '⏸ Выкл' : '▶ Вкл'}</button>
            <button data-del-code="${esc(c.id)}" class="px-2 py-1 rounded-lg bg-rose-500/15 text-rose-300">🗑</button>
          </td></tr>`;
      }).join('');
    }
    document.getElementById('cfGen').addEventListener('click', () => {
      const c = courseById(document.getElementById('cfCourse').value);
      document.getElementById('cfCode').value = genCode(c && c.slug);
    });
    document.getElementById('codeForm').addEventListener('submit', async e => {
      e.preventDefault();
      const exp = document.getElementById('cfExp').value;
      const max = document.getElementById('cfMax').value;
      const { error } = await sb.from('access_codes').insert({
        course_id: document.getElementById('cfCourse').value,
        code: document.getElementById('cfCode').value.trim().toUpperCase(),
        label: document.getElementById('cfLabel').value.trim() || null,
        max_uses: max ? Number(max) : null,
        expires_at: exp ? new Date(exp + 'T23:59:59').toISOString() : null,
        created_by: me.id
      });
      if (error) return toast(error.code === '23505' ? 'Такой код уже есть' : 'Ошибка: ' + error.message, true);
      toast('Код создан');
      e.target.reset();
      loadCodes();
    });
    document.getElementById('codesBody').addEventListener('click', async e => {
      const copy = e.target.closest('[data-copy]');
      const tog = e.target.closest('[data-toggle]');
      const del = e.target.closest('[data-del-code]');
      if (copy) {
        navigator.clipboard.writeText(copy.dataset.copy).then(() => toast('Скопировано'), () => prompt('Код:', copy.dataset.copy));
      } else if (tog) {
        await sb.from('access_codes').update({ is_active: tog.dataset.active !== '1' }).eq('id', tog.dataset.toggle);
        loadCodes();
      } else if (del && confirm('Удалить код? Ученики, уже вошедшие по нему, останутся на курсе.')) {
        await sb.from('access_codes').delete().eq('id', del.dataset.delCode);
        loadCodes();
      }
    });

    // ---------- Ученики ----------
    async function loadStudents() {
      const { data, error } = await sb.from('enrollments')
        .select('user_id, course_id, source, created_at, profiles!enrollments_user_id_fkey(full_name, email, grade)')
        .order('created_at', { ascending: false });
      enrollments = error ? [] : data;
      renderStudents();
    }
    function filteredStudents() {
      const q = document.getElementById('stSearch').value.toLowerCase().trim();
      const cid = document.getElementById('stCourse').value;
      return enrollments.filter(e => (!cid || e.course_id === cid) &&
        (!q || [e.profiles && e.profiles.full_name, e.profiles && e.profiles.email].some(v => (v || '').toLowerCase().includes(q))));
    }
    function renderStudents() {
      const list = filteredStudents();
      document.getElementById('studentsBody').innerHTML = list.length ? list.map(e => {
        const p = e.profiles || {};
        return `<tr>
          <td class="p-2.5 font-bold text-white">${esc(p.full_name || '—')}</td>
          <td class="p-2.5 font-mono text-cyan-300">${esc(p.email)}</td>
          <td class="p-2.5">${esc(p.grade || '—')}</td>
          <td class="p-2.5">${esc(cTitle(courseById(e.course_id)))}</td>
          <td class="p-2.5 text-slate-400">${SOURCE[e.source] || esc(e.source)}</td>
          <td class="p-2.5 text-slate-400">${fmtDate(e.created_at)}</td>
          <td class="p-2.5 text-right"><button data-unenroll="${esc(e.user_id)}|${esc(e.course_id)}" class="px-2 py-1 rounded-lg bg-rose-500/15 text-rose-300">Убрать с курса</button></td>
        </tr>`;
      }).join('') : '<tr><td colspan="7" class="p-4 text-slate-400">Учеников не найдено.</td></tr>';
    }
    document.getElementById('stSearch').addEventListener('input', renderStudents);
    document.getElementById('stCourse').addEventListener('change', renderStudents);
    document.getElementById('studentsBody').addEventListener('click', async e => {
      const b = e.target.closest('[data-unenroll]');
      if (!b || !confirm('Убрать ученика с курса? Он потеряет доступ.')) return;
      const [uid, cid] = b.dataset.unenroll.split('|');
      const { error } = await sb.from('enrollments').delete().eq('user_id', uid).eq('course_id', cid);
      if (error) return toast('Ошибка: ' + error.message, true);
      loadStudents();
    });
    document.getElementById('stCsv').addEventListener('click', () => {
      const list = filteredStudents();
      if (!list.length) return toast('Нет данных', true);
      const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
      const rows = [['Имя', 'Почта', 'Класс', 'Курс', 'Способ', 'Дата'].join(',')].concat(list.map(e => {
        const p = e.profiles || {};
        return [q(p.full_name), q(p.email), q(p.grade), q(cTitle(courseById(e.course_id))), q(e.source), q(fmtDate(e.created_at))].join(',');
      }));
      const url = URL.createObjectURL(new Blob(['﻿' + rows.join('\r\n')], { type: 'text/csv;charset=utf-8' }));
      const a = Object.assign(document.createElement('a'), { href: url, download: 'smb_students_' + new Date().toISOString().slice(0, 10) + '.csv' });
      document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    });

    // ---------- Курсы ----------
    function renderCourses() {
      document.getElementById('coursesList').innerHTML = courses.map(c => `
        <div class="p-4 rounded-2xl bg-slate-900 border border-slate-800 space-y-2">
          <div class="flex items-start gap-2">
            <span class="text-2xl">${esc(c.icon)}</span>
            <div class="flex-1 min-w-0">
              <div class="font-black text-white text-sm">${esc(cTitle(c))}</div>
              <div class="text-[11px] font-mono text-slate-400">${esc(c.slug)}/${esc(c.entry_file)} ${c.is_published ? '' : '· скрыт'} ${c.allow_requests ? '' : '· только по коду'}</div>
            </div>
          </div>
          <div class="flex flex-wrap gap-2 text-xs font-bold">
            <button data-edit="${esc(c.id)}" class="px-2.5 py-1.5 rounded-lg bg-slate-800">✏️ Изменить</button>
            <label class="px-2.5 py-1.5 rounded-lg bg-cyan-500/15 text-cyan-300 cursor-pointer">⬆️ Загрузить файлы
              <input type="file" multiple data-upload="${esc(c.id)}" class="hidden">
            </label>
            <a href="course.html?c=${encodeURIComponent(c.slug)}" class="px-2.5 py-1.5 rounded-lg bg-emerald-500/15 text-emerald-300">Открыть ↗</a>
          </div>
        </div>`).join('') || '<p class="text-sm text-slate-400">Курсов нет.</p>';
    }
    function fillCourseForm(c) {
      const v = (id, val) => { document.getElementById(id).value = val == null ? '' : val; };
      v('coId', c ? c.id : ''); v('coSlug', c ? c.slug : ''); v('coIcon', c ? c.icon : '📚');
      v('coOrder', c ? c.sort_order : 0); v('coEntry', c ? c.entry_file : 'index.html');
      v('coTitleKz', c && c.title_kz); v('coTitleRu', c && c.title_ru);
      v('coDescKz', c && c.description_kz); v('coDescRu', c && c.description_ru);
      document.getElementById('coPub').checked = c ? c.is_published : true;
      document.getElementById('coReq').checked = c ? c.allow_requests : true;
      document.getElementById('coSlug').readOnly = !!c; // адрес = папка с файлами, менять его нельзя
    }
    document.getElementById('coReset').addEventListener('click', () => fillCourseForm(null));
    document.getElementById('courseForm').addEventListener('submit', async e => {
      e.preventDefault();
      const id = document.getElementById('coId').value;
      const row = {
        slug: document.getElementById('coSlug').value.trim(),
        icon: document.getElementById('coIcon').value.trim() || '📚',
        sort_order: Number(document.getElementById('coOrder').value) || 0,
        entry_file: document.getElementById('coEntry').value.trim(),
        title_kz: document.getElementById('coTitleKz').value.trim(),
        title_ru: document.getElementById('coTitleRu').value.trim() || null,
        description_kz: document.getElementById('coDescKz').value.trim() || null,
        description_ru: document.getElementById('coDescRu').value.trim() || null,
        is_published: document.getElementById('coPub').checked,
        allow_requests: document.getElementById('coReq').checked
      };
      const { error } = id
        ? await sb.from('courses').update(row).eq('id', id)
        : await sb.from('courses').insert(Object.assign(row, { owner_id: me.id }));
      if (error) return toast(error.code === '23505' ? 'Курс с таким адресом уже есть' : 'Ошибка: ' + error.message, true);
      toast('Курс сохранён');
      fillCourseForm(null);
      await loadCourses();
      renderCourses();
    });
    document.getElementById('coursesList').addEventListener('click', e => {
      const b = e.target.closest('[data-edit]');
      if (!b) return;
      fillCourseForm(courseById(b.dataset.edit));
      document.getElementById('courseForm').scrollIntoView({ behavior: 'smooth' });
    });
    document.getElementById('coursesList').addEventListener('change', async e => {
      const input = e.target.closest('[data-upload]');
      if (!input || !input.files.length) return;
      const c = courseById(input.dataset.upload);
      for (const f of input.files) {
        const { error } = await sb.storage.from(BUCKET).upload(c.slug + '/' + f.name, f, { upsert: true, contentType: f.type || 'text/html' });
        if (error) toast(f.name + ': ' + error.message, true); else toast('Загружено: ' + f.name);
      }
      input.value = '';
    });

    // ---------- Старт ----------
    (async function () {
      if (!SMB.configured) { status.textContent = SMB.I18N.ru.notConfigured; return; }
      me = await SMB.currentUser();
      if (!me) { location.replace('index.html'); return; }
      myProfile = await SMB.loadProfile(me.id);
      if (!myProfile || myProfile.role === 'student') {
        status.textContent = 'Нет прав. Эта страница — для администратора и преподавателей.';
        return;
      }
      document.getElementById('whoami').textContent = me.email + ' · ' + myProfile.role;
      status.classList.add('hidden');
      document.getElementById('adminApp').classList.remove('hidden');
      await loadCourses();
      showTab('requests');
    })();
  </script>
</body>
</html>
