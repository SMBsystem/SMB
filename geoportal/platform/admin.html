<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMB Portal — управление</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#090d16">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; }
    .inp { width: 100%; padding: .5rem .75rem; background: #020617; border: 1px solid #334155; border-radius: .75rem; font-size: .8rem; color: #fff; }
    .inp:focus { outline: none; border-color: #22d3ee; }
    .lbl { display: block; font-size: 11px; font-weight: 700; color: #94a3b8; margin-bottom: .25rem; }
    .tab-on { background: #06b6d4; color: #020617; }
    .tab-off { background: #1e293b; color: #cbd5e1; }
    .chip { display: inline-flex; align-items: center; gap: .25rem; padding: .125rem .5rem; border-radius: .5rem; font-size: 10px; font-weight: 800; border: 1px solid; }
    .btn-s { padding: .375rem .625rem; border-radius: .5rem; font-size: 11px; font-weight: 700; background: #1e293b; color: #e2e8f0; }
    .btn-s:hover { background: #334155; }
  </style>
</head>
<body class="bg-[#090d16] text-slate-100 min-h-screen">
  <header class="sticky top-0 z-40 bg-slate-900/95 border-b border-slate-800">
    <div class="max-w-6xl mx-auto px-4 h-14 flex items-center justify-between gap-3">
      <div class="flex items-center gap-2 min-w-0">
        <span class="text-xl">👑</span>
        <span class="font-black text-white truncate">SMB Portal — управление</span>
        <span class="hidden sm:inline chip border-amber-500/40 text-amber-300 bg-amber-500/10">только для администратора</span>
      </div>
      <div class="flex items-center gap-2 text-xs font-bold shrink-0">
        <span id="whoami" class="hidden md:inline text-slate-400"></span>
        <a href="catalog.html" class="px-3 py-1.5 rounded-xl bg-slate-800 text-slate-200">📚 Каталог</a>
        <a href="index.html" class="px-3 py-1.5 rounded-xl bg-slate-800 text-slate-200">← Портал</a>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-6 space-y-5">
    <div id="status" class="text-sm font-bold text-slate-400">Загрузка…</div>

    <div id="adminApp" class="hidden space-y-5">
      <nav class="flex flex-wrap gap-2 text-xs font-black" role="tablist">
        <button data-tab="requests" class="px-3.5 py-2 rounded-xl">📨 Запросы <span id="reqCount" class="ml-1 px-1.5 rounded bg-rose-500 text-white">0</span></button>
        <button data-tab="codes" class="px-3.5 py-2 rounded-xl">🔑 Коды</button>
        <button data-tab="students" class="px-3.5 py-2 rounded-xl">👥 Ученики</button>
      </nav>

      <!-- ================= Запросы ================= -->
      <section data-panel="requests" class="hidden space-y-3">
        <div id="requestsList" class="space-y-2"></div>
      </section>

      <!-- ================= Коды ================= -->
      <section data-panel="codes" class="hidden space-y-4">
        <form id="genForm" class="p-4 rounded-2xl bg-slate-900 border border-amber-500/30 space-y-3">
          <h2 class="text-sm font-black text-amber-300">Создать коды</h2>
          <div class="grid sm:grid-cols-6 gap-3 items-end">
            <div class="sm:col-span-2"><label class="lbl" for="gCourse">Курс</label><select id="gCourse" class="inp" required></select></div>
            <fieldset class="sm:col-span-4">
              <legend class="lbl">Тип кода</legend>
              <div class="flex flex-wrap gap-2 text-xs font-bold">
                <label class="flex items-center gap-2 px-3 py-2 rounded-xl bg-slate-950 border border-slate-700 cursor-pointer"><input type="radio" name="gType" value="personal" checked> 👤 Личные — каждый код на 1 ученика</label>
                <label class="flex items-center gap-2 px-3 py-2 rounded-xl bg-slate-950 border border-slate-700 cursor-pointer"><input type="radio" name="gType" value="group"> 👥 Один код на группу</label>
              </div>
            </fieldset>
            <div id="gCountWrap"><label class="lbl" for="gCount">Сколько кодов</label><input id="gCount" type="number" min="1" max="200" value="25" class="inp"></div>
            <div id="gMaxWrap" class="hidden"><label class="lbl" for="gMax">Мест (пусто = ∞)</label><input id="gMax" type="number" min="1" class="inp"></div>
            <div class="sm:col-span-2"><label class="lbl" for="gLabel">Подпись: класс / группа</label><input id="gLabel" class="inp" maxlength="80" placeholder="11А, вечерняя группа…"></div>
            <div><label class="lbl" for="gExp">Действует до</label><input id="gExp" type="date" class="inp"></div>
            <div class="sm:col-span-2"><button id="genBtn" class="w-full py-2.5 rounded-xl bg-amber-400 text-slate-950 font-black text-sm disabled:opacity-60">🎲 Сгенерировать</button></div>
          </div>
          <p class="text-[11px] text-slate-500">Коды создаёт сервер: случайные, без похожих символов (0/O, 1/I). Подобрать нельзя — после 10 ошибок в час ввод блокируется.</p>
        </form>

        <div id="genResult" class="hidden p-4 rounded-2xl bg-emerald-500/10 border border-emerald-500/40 space-y-3">
          <div class="flex flex-wrap items-center gap-2">
            <h3 id="genTitle" class="font-black text-emerald-300 text-sm mr-auto"></h3>
            <button id="genCopy" class="btn-s">📋 Копировать всё</button>
            <button id="genCsv" class="btn-s">📥 CSV</button>
            <button id="genPrint" class="btn-s">🖨 Карточки для печати</button>
            <button id="genClose" class="btn-s">✕</button>
          </div>
          <div id="genList" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-2 max-h-72 overflow-y-auto"></div>
        </div>

        <div class="flex flex-wrap gap-2">
          <select id="cdCourse" class="inp max-w-xs" aria-label="Курс"></select>
          <input id="cdSearch" class="inp max-w-xs" placeholder="Код или подпись…" aria-label="Поиск кода">
          <select id="cdStatus" class="inp max-w-[11rem]" aria-label="Статус">
            <option value="active">Только рабочие</option>
            <option value="all">Все коды</option>
          </select>
        </div>
        <div class="overflow-x-auto rounded-2xl border border-slate-800">
          <table class="w-full text-xs text-left">
            <thead class="bg-slate-900 text-slate-400 uppercase text-[10px]"><tr>
              <th class="p-2.5">Код</th><th class="p-2.5">Курс</th><th class="p-2.5">Подпись</th><th class="p-2.5">Мест</th><th class="p-2.5">До</th><th class="p-2.5">Статус</th><th class="p-2.5 text-right">Действия</th>
            </tr></thead>
            <tbody id="codesBody" class="divide-y divide-slate-800"></tbody>
          </table>
        </div>
      </section>

      <!-- ================= Ученики ================= -->
      <section data-panel="students" class="hidden space-y-3">
        <div class="flex flex-wrap gap-2">
          <input id="stSearch" class="inp max-w-xs" placeholder="Имя или почта…" aria-label="Поиск">
          <select id="stCourse" class="inp max-w-xs" aria-label="Курс"></select>
          <button id="stCsv" class="px-3 py-2 rounded-xl bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 text-xs font-bold">📥 CSV</button>
        </div>
        <div class="overflow-x-auto rounded-2xl border border-slate-800">
          <table class="w-full text-xs text-left">
            <thead class="bg-slate-900 text-slate-400 uppercase text-[10px]"><tr>
              <th class="p-2.5">Имя</th><th class="p-2.5">Почта</th><th class="p-2.5">Класс</th><th class="p-2.5">Курс</th><th class="p-2.5">Как попал</th><th class="p-2.5">Дата</th><th class="p-2.5 text-right"></th>
            </tr></thead>
            <tbody id="studentsBody" class="divide-y divide-slate-800"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <script>
    const { sb, esc, toast } = SMB;
    let me = null, myProfile = null;
    let catalog = [], codesCache = [], enrollments = [];
    let lastGenerated = [];

    const $ = id => document.getElementById(id);
    const fmtDate = d => d ? new Date(d).toLocaleString('ru-RU', { dateStyle: 'short', timeStyle: 'short' }) : '—';
    const fmtDay = d => d ? new Date(d).toLocaleDateString('ru-RU') : '—';
    const courseById = id => catalog.find(c => c.id === id);
    const cTitle = c => c ? (c.title_ru || c.title_kz) : '—';
    const inviteLink = code => new URL('index.html?code=' + encodeURIComponent(code), location.href).href;
    const SOURCE = { code: '🔑 код', request: '📨 запрос', admin: '👑 вручную' };

    function copyText(text, okMsg) {
      navigator.clipboard.writeText(text).then(() => toast(okMsg || 'Скопировано'), () => prompt('Скопируйте:', text));
    }
    function downloadCsv(name, header, rows) {
      const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
      const csv = '﻿' + [header.map(q).join(',')].concat(rows.map(r => r.map(q).join(','))).join('\r\n');
      const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
      const a = Object.assign(document.createElement('a'), { href: url, download: name });
      document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    }

    // ---------- Вкладки ----------
    function showTab(name) {
      document.querySelectorAll('[data-tab]').forEach(b => b.className = 'px-3.5 py-2 rounded-xl ' + (b.dataset.tab === name ? 'tab-on' : 'tab-off'));
      document.querySelectorAll('[data-panel]').forEach(p => p.classList.toggle('hidden', p.dataset.panel !== name));
      ({ requests: loadRequests, codes: loadCodes, students: loadStudents })[name]();
    }
    document.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));

    // Список курсов для выпадающих списков и счётчик запросов (сами курсы — на странице «Каталог»).
    async function loadCatalog() {
      const { data, error } = await sb.rpc('admin_course_catalog');
      if (error) { toast('Курсы: ' + error.message, true); catalog = []; }
      else catalog = data || [];

      const opts = catalog.map(c => `<option value="${esc(c.id)}">${esc(c.icon)} ${esc(cTitle(c))}${c.is_published ? '' : ' (скрыт)'}</option>`).join('');
      $('gCourse').innerHTML = opts;
      $('cdCourse').innerHTML = '<option value="">Все курсы</option>' + opts;
      $('stCourse').innerHTML = '<option value="">Все курсы</option>' + opts;
      $('reqCount').textContent = catalog.reduce((s, c) => s + Number(c.pending_requests), 0);
    }

    // =====================================================================
    //  Запросы
    // =====================================================================
    async function loadRequests() {
      const box = $('requestsList');
      const { data, error } = await sb.from('access_requests')
        .select('id, course_id, message, created_at, profiles!access_requests_user_id_fkey(full_name, email, grade)')
        .eq('status', 'pending').order('created_at');
      if (error) { box.textContent = 'Не удалось загрузить запросы.'; return; }
      $('reqCount').textContent = data.length;
      if (!data.length) { box.innerHTML = '<p class="p-5 rounded-2xl border border-dashed border-slate-700 text-sm text-slate-400">Новых запросов нет.</p>'; return; }
      box.innerHTML = data.map(r => {
        const p = r.profiles || {};
        return `<div class="p-4 rounded-2xl bg-slate-900 border border-slate-800 flex flex-col sm:flex-row sm:items-center gap-3">
          <div class="flex-1 min-w-0 text-sm">
            <div class="font-black text-white">${esc(p.full_name || '(без имени)')} <span class="font-mono text-cyan-300 text-xs">${esc(p.email)}</span> ${p.grade ? `<span class="text-xs text-slate-400">· ${esc(p.grade)} кл.</span>` : ''}</div>
            <div class="text-xs text-slate-400">→ ${esc(cTitle(courseById(r.course_id)))} · ${fmtDate(r.created_at)}</div>
            ${r.message ? `<div class="mt-1 text-xs text-slate-300 italic">«${esc(r.message)}»</div>` : ''}
          </div>
          <div class="flex gap-2 shrink-0">
            <button data-decide="${esc(r.id)}" data-ok="1" class="px-3 py-2 rounded-xl bg-emerald-500 text-slate-950 text-xs font-black">✓ Принять</button>
            <button data-decide="${esc(r.id)}" data-ok="0" class="px-3 py-2 rounded-xl bg-rose-500/20 text-rose-300 text-xs font-bold">✕ Отклонить</button>
          </div>
        </div>`;
      }).join('');
    }
    $('requestsList').addEventListener('click', async e => {
      const b = e.target.closest('[data-decide]');
      if (!b) return;
      b.disabled = true;
      const { data, error } = await sb.rpc('decide_request', { p_request: b.dataset.decide, p_approve: b.dataset.ok === '1' });
      if (error || !data || !data.ok) toast('Не получилось: ' + ((data && data.error) || (error && error.message)), true);
      else toast(b.dataset.ok === '1' ? 'Ученик добавлен на курс' : 'Запрос отклонён');
      await loadRequests();
      loadCatalog();
    });

    // =====================================================================
    //  Коды
    // =====================================================================
    function codeStatus(c) {
      if (!c.is_active) return ['off', '⏸ Выключен', 'text-slate-400'];
      if (c.expires_at && new Date(c.expires_at) < new Date()) return ['expired', '⌛ Истёк', 'text-slate-400'];
      if (c.max_uses && c.uses >= c.max_uses) return ['full', c.max_uses === 1 ? '✓ Использован' : '✓ Мест нет', 'text-cyan-300'];
      return ['ok', '● Работает', 'text-emerald-300'];
    }

    document.querySelectorAll('input[name="gType"]').forEach(r => r.addEventListener('change', () => {
      const personal = document.querySelector('input[name="gType"]:checked').value === 'personal';
      $('gCountWrap').classList.toggle('hidden', !personal);
      $('gMaxWrap').classList.toggle('hidden', personal);
    }));

    $('genForm').addEventListener('submit', async e => {
      e.preventDefault();
      const personal = document.querySelector('input[name="gType"]:checked').value === 'personal';
      const exp = $('gExp').value;
      const count = personal ? Math.min(200, Math.max(1, Number($('gCount').value) || 1)) : 1;
      const btn = $('genBtn');
      btn.disabled = true;
      const { data, error } = await sb.rpc('generate_codes', {
        p_course: $('gCourse').value,
        p_count: count,
        p_max_uses: personal ? 1 : ($('gMax').value ? Number($('gMax').value) : null),
        p_label: $('gLabel').value.trim() || null,
        p_expires: exp ? new Date(exp + 'T23:59:59').toISOString() : null
      });
      btn.disabled = false;
      if (error) return toast('Ошибка: ' + error.message, true);
      lastGenerated = data || [];
      showGenerated();
      await Promise.all([loadCodes(), loadCatalog()]);
    });

    function showGenerated() {
      const n = lastGenerated.length;
      $('genResult').classList.toggle('hidden', !n);
      if (!n) return;
      const c = courseById(lastGenerated[0].course_id);
      $('genTitle').textContent = `Создано кодов: ${n} · ${cTitle(c)}${lastGenerated[0].label ? ' · ' + lastGenerated[0].label : ''}`;
      $('genList').innerHTML = lastGenerated.map(x => `
        <div class="p-2.5 rounded-xl bg-slate-950 border border-slate-800 flex items-center gap-2">
          <span class="font-mono font-black text-amber-300 text-sm flex-1">${esc(x.code)}</span>
          <button data-copy="${esc(x.code)}" class="btn-s" title="Копировать код">📋</button>
          <button data-copy="${esc(inviteLink(x.code))}" class="btn-s" title="Копировать ссылку-приглашение">🔗</button>
        </div>`).join('');
    }
    $('genList').addEventListener('click', e => { const b = e.target.closest('[data-copy]'); if (b) copyText(b.dataset.copy); });
    $('genClose').addEventListener('click', () => { lastGenerated = []; showGenerated(); });
    $('genCopy').addEventListener('click', () => copyText(lastGenerated.map(x => x.code + '  ' + inviteLink(x.code)).join('\n'), 'Скопированы все коды со ссылками'));
    $('genCsv').addEventListener('click', () => {
      downloadCsv('codes_' + new Date().toISOString().slice(0, 10) + '.csv',
        ['Код', 'Ссылка-приглашение', 'Курс', 'Подпись', 'Мест', 'Действует до'],
        lastGenerated.map(x => [x.code, inviteLink(x.code), cTitle(courseById(x.course_id)), x.label, x.max_uses || '∞', fmtDay(x.expires_at)]));
    });
    $('genPrint').addEventListener('click', () => {
      const w = window.open('', '_blank');
      if (!w) return toast('Разрешите всплывающие окна для печати', true);
      const cards = lastGenerated.map(x => {
        const c = courseById(x.course_id);
        return `<div class="card">
          <div class="course">${esc(c ? c.icon + ' ' + c.title_kz : '')}</div>
          ${x.label ? `<div class="label">${esc(x.label)}</div>` : ''}
          <div class="code">${esc(x.code)}</div>
          <div class="how">Кіру / Вход: ${esc(new URL('index.html', location.href).href)}</div>
          ${x.expires_at ? `<div class="how">Дейін / До: ${esc(fmtDay(x.expires_at))}</div>` : ''}
        </div>`;
      }).join('');
      w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Коды</title><style>
        body{font-family:system-ui,sans-serif;margin:16px;color:#000}
        .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
        .card{border:1.5px dashed #555;border-radius:10px;padding:12px;break-inside:avoid}
        .course{font-weight:800;font-size:12px}.label{font-size:11px;color:#444;margin-top:2px}
        .code{font-family:ui-monospace,monospace;font-weight:900;font-size:20px;letter-spacing:1px;margin:8px 0}
        .how{font-size:9px;color:#333;word-break:break-all}
        @media print{body{margin:0}}
      </style></head><body><div class="grid">${cards}</div><script>window.onload=function(){window.print()}<\/script></body></html>`);
      w.document.close();
    });

    async function loadCodes() {
      const { data, error } = await sb.from('access_codes').select('*').order('created_at', { ascending: false });
      codesCache = error ? [] : data;
      if (error) toast('Коды: ' + error.message, true);
      renderCodes();
    }
    function renderCodes() {
      const cid = $('cdCourse').value;
      const q = $('cdSearch').value.toLowerCase().trim();
      const onlyActive = $('cdStatus').value === 'active';
      const list = codesCache.filter(c => (!cid || c.course_id === cid)
        && (!onlyActive || codeStatus(c)[0] === 'ok')
        && (!q || [c.code, c.label].some(v => (v || '').toLowerCase().includes(q))));
      $('codesBody').innerHTML = list.length ? list.map(c => {
        const [st, stText, stCls] = codeStatus(c);
        return `<tr data-row="${esc(c.id)}" class="${st === 'ok' ? '' : 'opacity-70'}">
          <td class="p-2.5 font-mono font-black text-amber-300 whitespace-nowrap">${esc(c.code)}</td>
          <td class="p-2.5">${esc(cTitle(courseById(c.course_id)))}</td>
          <td class="p-2.5 text-slate-400">${esc(c.label || '')}</td>
          <td class="p-2.5 whitespace-nowrap">${c.uses} / ${c.max_uses || '∞'}</td>
          <td class="p-2.5 text-slate-400 whitespace-nowrap">${fmtDay(c.expires_at)}</td>
          <td class="p-2.5 font-bold whitespace-nowrap ${stCls}">${stText}</td>
          <td class="p-2.5 text-right whitespace-nowrap">
            <button data-copy="${esc(c.code)}" class="btn-s" title="Копировать код">📋</button>
            <button data-copy="${esc(inviteLink(c.code))}" class="btn-s" title="Ссылка-приглашение">🔗</button>
            <button data-who="${esc(c.id)}" class="btn-s" title="Кто вошёл по коду">👥 ${c.uses}</button>
            <button data-toggle="${esc(c.id)}" class="btn-s">${c.is_active ? '⏸' : '▶'}</button>
            <button data-revoke="${esc(c.id)}" class="btn-s text-rose-300" title="Отозвать и убрать учеников">🚫</button>
            <button data-del="${esc(c.id)}" class="btn-s text-rose-300" title="Удалить код">🗑</button>
          </td></tr>`;
      }).join('') : '<tr><td colspan="7" class="p-4 text-slate-400">Кодов нет. Создайте их формой выше.</td></tr>';
    }
    $('cdCourse').addEventListener('change', renderCodes);
    $('cdSearch').addEventListener('input', renderCodes);
    $('cdStatus').addEventListener('change', renderCodes);

    $('codesBody').addEventListener('click', async e => {
      const b = e.target.closest('button');
      if (!b) return;
      const d = b.dataset;
      if (d.copy) return copyText(d.copy);
      if (d.who) return toggleWho(b, d.who);
      if (d.toggle) {
        const c = codesCache.find(x => x.id === d.toggle);
        await sb.from('access_codes').update({ is_active: !c.is_active }).eq('id', c.id);
      } else if (d.revoke) {
        if (!confirm('Отозвать код? Он перестанет работать, а ученики, вошедшие по нему, потеряют доступ к курсу.')) return;
        await sb.from('access_codes').update({ is_active: false }).eq('id', d.revoke);
        const { error } = await sb.from('enrollments').delete().eq('code_id', d.revoke);
        if (error) toast('Ошибка: ' + error.message, true); else toast('Код отозван, доступ закрыт');
      } else if (d.del) {
        if (!confirm('Удалить код? Ученики, уже вошедшие по нему, останутся на курсе.')) return;
        await sb.from('access_codes').delete().eq('id', d.del);
      } else return;
      await Promise.all([loadCodes(), loadCatalog()]);
    });

    async function toggleWho(btn, codeId) {
      const tr = btn.closest('tr');
      const next = tr.nextElementSibling;
      if (next && next.dataset.whoRow) { next.remove(); return; }
      const { data } = await sb.from('enrollments')
        .select('created_at, profiles!enrollments_user_id_fkey(full_name, email)')
        .eq('code_id', codeId).order('created_at');
      const row = document.createElement('tr');
      row.dataset.whoRow = '1';
      row.innerHTML = `<td colspan="7" class="p-3 bg-slate-950">${(data && data.length)
        ? data.map(e => `<div class="text-xs"><b class="text-white">${esc((e.profiles || {}).full_name || '—')}</b> <span class="font-mono text-cyan-300">${esc((e.profiles || {}).email)}</span> <span class="text-slate-500">· ${fmtDate(e.created_at)}</span></div>`).join('')
        : '<span class="text-xs text-slate-400">По этому коду ещё никто не вошёл.</span>'}</td>`;
      tr.after(row);
    }

    // =====================================================================
    //  Ученики
    // =====================================================================
    async function loadStudents() {
      const { data, error } = await sb.from('enrollments')
        .select('user_id, course_id, source, created_at, profiles!enrollments_user_id_fkey(full_name, email, grade), access_codes(code)')
        .order('created_at', { ascending: false });
      enrollments = error ? [] : data;
      renderStudents();
    }
    function filteredStudents() {
      const q = $('stSearch').value.toLowerCase().trim();
      const cid = $('stCourse').value;
      return enrollments.filter(e => (!cid || e.course_id === cid) &&
        (!q || [e.profiles && e.profiles.full_name, e.profiles && e.profiles.email].some(v => (v || '').toLowerCase().includes(q))));
    }
    function howJoined(e) {
      return (SOURCE[e.source] || esc(e.source)) + (e.access_codes ? ` <span class="font-mono text-amber-300">${esc(e.access_codes.code)}</span>` : '');
    }
    function renderStudents() {
      const list = filteredStudents();
      $('studentsBody').innerHTML = list.length ? list.map(e => {
        const p = e.profiles || {};
        return `<tr>
          <td class="p-2.5 font-bold text-white">${esc(p.full_name || '—')}</td>
          <td class="p-2.5 font-mono text-cyan-300">${esc(p.email)}</td>
          <td class="p-2.5">${esc(p.grade || '—')}</td>
          <td class="p-2.5">${esc(cTitle(courseById(e.course_id)))}</td>
          <td class="p-2.5 text-slate-400 whitespace-nowrap">${howJoined(e)}</td>
          <td class="p-2.5 text-slate-400 whitespace-nowrap">${fmtDate(e.created_at)}</td>
          <td class="p-2.5 text-right"><button data-unenroll="${esc(e.user_id)}|${esc(e.course_id)}" class="btn-s text-rose-300">Убрать с курса</button></td>
        </tr>`;
      }).join('') : '<tr><td colspan="7" class="p-4 text-slate-400">Учеников не найдено.</td></tr>';
    }
    $('stSearch').addEventListener('input', renderStudents);
    $('stCourse').addEventListener('change', renderStudents);
    $('studentsBody').addEventListener('click', async e => {
      const b = e.target.closest('[data-unenroll]');
      if (!b || !confirm('Убрать ученика с курса? Он потеряет доступ.')) return;
      const [uid, cid] = b.dataset.unenroll.split('|');
      const { error } = await sb.from('enrollments').delete().eq('user_id', uid).eq('course_id', cid);
      if (error) return toast('Ошибка: ' + error.message, true);
      await Promise.all([loadStudents(), loadCatalog()]);
    });
    $('stCsv').addEventListener('click', () => {
      const list = filteredStudents();
      if (!list.length) return toast('Нет данных', true);
      downloadCsv('smb_students_' + new Date().toISOString().slice(0, 10) + '.csv',
        ['Имя', 'Почта', 'Класс', 'Курс', 'Как попал', 'Код', 'Дата'],
        list.map(e => {
          const p = e.profiles || {};
          return [p.full_name, p.email, p.grade, cTitle(courseById(e.course_id)), e.source, e.access_codes ? e.access_codes.code : '', fmtDate(e.created_at)];
        }));
    });

    // ---------- Старт: только админ и преподаватель ----------
    // Ссылки из каталога открывают нужную вкладку и курс: admin.html?tab=codes&course=ID
    (async function () {
      if (!SMB.configured) { $('status').textContent = SMB.I18N.ru.notConfigured; return; }
      me = await SMB.currentUser();
      if (!me) { location.replace('index.html'); return; }
      myProfile = await SMB.loadProfile(me.id);
      if (!myProfile || myProfile.role === 'student') {
        $('status').textContent = '🔒 Нет доступа. Эта страница только для администратора.';
        return;
      }
      $('whoami').textContent = me.email + ' · ' + (myProfile.role === 'admin' ? 'администратор' : 'преподаватель');
      $('status').classList.add('hidden');
      $('adminApp').classList.remove('hidden');
      await loadCatalog();

      const params = new URLSearchParams(location.search);
      const tab = ['requests', 'codes', 'students'].includes(params.get('tab')) ? params.get('tab') : 'requests';
      const course = params.get('course') || '';
      if (course) { ['gCourse', 'cdCourse', 'stCourse'].forEach(id => { $(id).value = course; }); }
      showTab(tab);
    })();
  </script>
</body>
</html>
