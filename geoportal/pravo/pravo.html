    var LET = 'ABCDEFGH';

    /* ---------- прогресс ---------- */
    function load() {
      var d = null;
      try { d = JSON.parse(localStorage.getItem(LS) || 'null'); } catch (e) {}
      d = d || {};
      d.read = d.read || {}; d.quiz = d.quiz || {}; d.tests = d.tests || {}; d.mist = d.mist || {}; d.known = d.known || {};
      return d;
    }
    function save(d) { try { localStorage.setItem(LS, JSON.stringify(d)); } catch (e) {} }
    function toast(m) {
      var b = $('toast'); b.textContent = m; b.style.opacity = '1';
      clearTimeout(b._t); b._t = setTimeout(function () { b.style.opacity = '0'; }, 2500);
    }

    /* ---------- данные ---------- */
    var MODS = Object.keys(P.modules).map(Number).sort(function (a, b) { return a - b; }).map(function (n) { return P.modules[n]; });
    var TESTS = Object.keys(P.tests).map(Number).sort(function (a, b) { return a - b; }).map(function (n) { return P.tests[n]; });
    var BANK = {};   // qid -> вопрос
    MODS.forEach(function (m) {
      m.quiz.forEach(function (q, i) { q.qid = 'm' + m.id + '-' + (i + 1); BANK[q.qid] = q; });
    });
    TESTS.forEach(function (tt) {
      tt.questions.forEach(function (q) {
        q.qid = 't' + tt.id + '-' + q.id;
        if (q.ctx && tt.contexts) q._ctx = tt.contexts[q.ctx];
        BANK[q.qid] = q;
      });
    });
    var TERMS = [];
    MODS.forEach(function (m) { (m.terms || []).forEach(function (x) { TERMS.push({ m: m.id, x: x }); }); });

    function maxPts(q) { return q.type === 'multi' ? 2 : q.type === 'match' ? q.left.length : 1; }
    function grade(q, a) {
      if (a == null) return 0;
      if (q.type === 'single') return a === q.answer ? 1 : 0;
      if (q.type === 'multi') {
        if (!a.length) return 0;
        var err = 0;
        q.options.forEach(function (_, i) { if ((a.indexOf(i) >= 0) !== (q.answer.indexOf(i) >= 0)) err++; });
        return err === 0 ? 2 : err === 1 ? 1 : 0;
      }
      var s = 0;
      q.answer.forEach(function (v, i) { if (a[i] === v) s++; });
      return s;
    }
    function answered(q, a) {
      if (a == null) return false;
      if (q.type === 'multi') return a.length > 0;
      if (q.type === 'match') return a.some(function (v) { return v != null && v >= 0; });
      return true;
    }
    function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var x = a[i]; a[i] = a[j]; a[j] = x; } return a; }

    function go(h) { if (location.hash === h) route(); else location.hash = h; }
    function route() {
      clearInterval(timer);
      var h = (location.hash || '#/').replace(/^#\/?/, '');
      var p = h.split('/');
      if (run && p[0] !== 'run') run = null;
      window.scrollTo(0, 0);
      if (p[0] === 'm' && P.modules[+p[1]]) return viewModule(+p[1]);
      if (p[0] === 'tests') return viewTests();
      if (p[0] === 'glossary') return viewGlossary();
      if (p[0] === 'mistakes') return viewMistakes();
      if (p[0] === 'plan') return viewPlan();
      if (p[0] === 'info') return viewInfo();
      if (p[0] === 'run' && run) return viewRun();
      viewHome();
    }

    function chrome() {
      document.documentElement.lang = lang === 'ru' ? 'ru' : 'kk';
      $('langSel').value = lang;
      $('hSub').textContent = t('sub');
      $('hPortal').textContent = t('portal');

    function stats() {
      var d = load();
      var rd = MODS.filter(function (m) { return d.read[m.id]; }).length;
      var qs = MODS.filter(function (m) { return d.quiz[m.id]; });

      var bt = 0;
      TESTS.forEach(function (tt) { (d.tests[tt.id] || []).forEach(function (r) { if (r.score > bt) bt = r.score; }); });
      return { d: d, rd: rd, avg: avg, bt: bt, mist: Object.keys(d.mist).length };
    }

        (i < MODS.length - 1 ? '<a class="text-cyan-300 text-right" href="#/m/' + MODS[i + 1].id + '">' + esc(pk(MODS[i + 1], 'title')) + ' →</a>' : '<span></span>') + '</div>';
      $('app').innerHTML = h;

    /* ---------- пробные варианты ---------- */
    function viewTests() {
      chrome();
      var d = load();
      var h = crumbs([{ t: t('tests') }]) + '<h1 class="text-2xl font-black mb-1">' + t('tests') + '</h1><p class="text-sm text-slate-400 mb-5">' + (lang === 'ru'
        ? '40 вопросов, 50 баллов: 1–25 — один ответ, 26–30 — по тексту, 31–35 — соответствие, 36–40 — несколько ответов. На экзамене — ' + TEST_MIN + ' минут.'
        : '40 сұрақ, 50 балл: 1–25 — бір жауап, 26–30 — мәтін бойынша, 31–35 — сәйкестік, 36–40 — бірнеше жауап. Емтихан — ' + TEST_MIN + ' минут.') + '</p><div class="grid gap-4 sm:grid-cols-2">';
      TESTS.forEach(function (tt) {

        h += '<div class="card p-5 flex flex-col gap-3"><div class="flex items-center justify-between"><h3 class="font-black text-lg">' + (lang === 'ru' ? 'Вариант ' : 'Нұсқа ') + tt.id + '</h3>' +
          '<span class="text-xs text-slate-400">' + tt.questions.length + ' ' + t('q') + ' · ' + TEST_MIN + ' ' + t('min') + '</span></div>' +
          '<p class="text-sm text-slate-400 flex-1">' + esc(pk(tt, 'desc') || '') + '</p>' +
          '<p class="text-xs text-slate-500">' + t('best') + ': <b class="text-amber-300">' + (hist.length ? best + '/' + maxOf(tt.questions) : '—') + '</b> · ' + hist.length + ' ' + t('attempts') + '</p>' +

    function maxOf(qs) { return qs.reduce(function (s, q) { return s + maxPts(q); }, 0); }

    /* ---------- запуск ---------- */
    function startRun(cfg) {
      run = { cfg: cfg, qs: cfg.qs, ans: {}, checked: {}, flags: {}, idx: 0, t0: Date.now(), left: cfg.min ? cfg.min * 60 : 0, done: false };

      if (location.hash === '#/run') route();
    }
    function runModuleQuiz(id) {
      var m = P.modules[id];

    }
    function runTest(id, mode) {
      var tt = P.tests[id];
      startRun({ kind: 'test', id: id, title: (lang === 'ru' ? 'Вариант ' : 'Нұсқа ') + id, qs: tt.questions.slice(), mode: mode, min: mode === 'exam' ? TEST_MIN : 0, back: '#/tests' });
    }
    function runMix() {
      var all = Object.keys(BANK).map(function (k) { return BANK[k]; });
      var picked = shuffle(all.filter(function (q) { return q.type === 'single' && !q.ctx; })).slice(0, 30)
        .concat(shuffle(all.filter(function (q) { return q.type === 'match'; })).slice(0, 5))
        .concat(shuffle(all.filter(function (q) { return q.type === 'multi'; })).slice(0, 5));
      startRun({ kind: 'mix', title: t('mix'), qs: picked, mode: 'exam', min: TEST_MIN, back: '#/' });
    }

      var d = load();

    }

    /* ---------- прохождение ---------- */
    function fmt(s) { s = Math.max(0, s); return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }

    function viewRun() {
      chrome();

      var h = '<div class="flex flex-wrap items-center justify-between gap-3 mb-4">' +
        '<div><p class="text-[11px] font-black uppercase tracking-widest text-cyan-300">' + esc(c.title) + '</p><p class="text-sm text-slate-400">' + t('question') + ' ' + (run.idx + 1) + ' / ' + run.qs.length + '</p></div>' +

      }).join('') + '</div>';

      h += '<section class="card p-5 sm:p-7">';
      if (q._ctx) {
        h += '<div class="mb-5 rounded-2xl bg-slate-800/70 border border-slate-700 p-4"><p class="text-[11px] font-black uppercase tracking-wider text-amber-300 mb-1">' + t('ctx') + (pk(q._ctx, 'title') ? ': ' + esc(pk(q._ctx, 'title')) : '') + '</p><div class="prose-l text-sm">' + pk(q._ctx, 'text') + '</div></div>';
      }
      h += '<p class="text-lg font-bold text-white leading-snug whitespace-pre-line">' + esc(pk(q, 'q')) + '</p>';

          left.map(function (l, i) {
            var sel = a && a[i] != null ? a[i] : -1;

            return '<div class="flex items-center gap-3"><span class="font-black text-cyan-300 w-6">' + LET[i] + '</span><span class="flex-1 text-sm">' + esc(l) + '</span>' +
              '<select data-act="match" data-i="' + i + '" ' + (chk ? 'disabled' : '') + ' class="bg-slate-800 border-2 ' + (cls || 'border-slate-600') + ' rounded-xl px-2 py-1.5 text-sm font-bold"><option value="-1">' + t('pick') + '</option>' +
              opts.map(function (o, k) { return '<option value="' + k + '"' + (sel === k ? ' selected' : '') + '>' + (k + 1) + '</option>'; }).join('') + '</select></div>';
          }).join('') + '</div><ol class="grid gap-1.5 text-sm text-slate-300">' +
          opts.map(function (o, k) { return '<li class="flex gap-3"><span class="font-black text-amber-300 w-6">' + (k + 1) + '</span><span>' + esc(o) + '</span></li>'; }).join('') + '</ol>';
      } else {
        h += '<div class="mt-4 grid gap-2.5">' + opts.map(function (o, k) {
          var cls = 'opt';
          var on = q.type === 'multi' ? (a || []).indexOf(k) >= 0 : a === k;
          if (on) cls += ' sel';
          if (chk) {
            var right = q.type === 'multi' ? q.answer.indexOf(k) >= 0 : q.answer === k;
            if (right) cls = 'opt right'; else if (on) cls = 'opt wrong';

        }).join('') + '</div>';
      }
      if (chk) h += expl(q);
      h += '</section>';

      h += '<div class="mt-5 flex flex-wrap items-center justify-between gap-3">' +
        '<div class="flex gap-2"><button class="btn btn-sec" data-act="prev" ' + (run.idx === 0 ? 'disabled' : '') + '>← ' + t('prev') + '</button>' +
        (!practice ? '<button class="btn btn-sec" data-act="flag">' + (run.flags[run.idx] ? '🚩' : '⚑') + ' ' + t('flag') + '</button>' : '') + '</div>' +
        '<div class="flex gap-2">' +
        (practice && !chk ? '<button class="btn btn-main" data-act="check" ' + (answered(q, a) ? '' : 'disabled') + '>' + t('check') + '</button>' : '') +
        (run.idx < run.qs.length - 1 ? '<button class="btn ' + (practice && !chk ? 'btn-sec' : 'btn-main') + '" data-act="next">' + t('next') + ' →</button>' : '') +
        '<button class="btn btn-sec" data-act="finish">🏁 ' + t('finish') + '</button></div></div>';
      $('app').innerHTML = h;
      if (c.min && !run.done) {
        clearInterval(timer);
        timer = setInterval(function () {
          run.left = c.min * 60 - Math.floor((Date.now() - run.t0) / 1000);
          var el = $('clock'); if (el) el.textContent = fmt(run.left);
          if (run.left <= 0) { clearInterval(timer); toast(t('timeUp')); finishRun(); }
        }, 1000);
      }
    }

    function rightText(q) {
      var o = pk(q, 'options');
      if (q.type === 'single') return LET[q.answer] + '. ' + o[q.answer];
      if (q.type === 'multi') return q.answer.map(function (k) { return LET[k] + '. ' + o[k]; }).join('; ');
      return pk(q, 'left').map(function (l, i) { return LET[i] + ' → ' + (q.answer[i] + 1); }).join(', ');
    }
    function userText(q, a) {
      var o = pk(q, 'options');
      if (!answered(q, a)) return t('noAns');
      if (q.type === 'single') return LET[a] + '. ' + o[a];
      if (q.type === 'multi') return a.slice().sort().map(function (k) { return LET[k] + '. ' + o[k]; }).join('; ');
      return pk(q, 'left').map(function (l, i) { return LET[i] + ' → ' + (a[i] != null && a[i] >= 0 ? a[i] + 1 : '—'); }).join(', ');
    }
    function expl(q) {
      var e = pk(q, 'explanation');
      return '<div class="mt-4 rounded-2xl bg-slate-800/70 border border-slate-700 p-4 text-sm"><p class="text-emerald-300 font-bold">' + t('rightAns') + ': ' + esc(rightText(q)) + '</p>' +
        (e ? '<p class="mt-2 text-slate-300 leading-relaxed">' + esc(e) + '</p>' : '') + '</div>';
    }

    function finishRun() {
      if (!run || run.done) return;
      clearInterval(timer);
      run.done = true;
      run.sec = Math.round((Date.now() - run.t0) / 1000);
      var d = load(), got = 0, max = 0;
      run.qs.forEach(function (q, i) {
        var g = grade(q, run.ans[i]), m = maxPts(q);
        got += g; max += m;
        if (g < m) d.mist[q.qid] = (d.mist[q.qid] || 0) + 1;
        else if (d.mist[q.qid]) delete d.mist[q.qid];
      });
      run.got = got; run.max = max;
      var c = run.cfg;
      if (c.kind === 'module') {
        var cur = d.quiz[c.id];
        if (!cur || got / max >= cur.best / cur.max) d.quiz[c.id] = { best: got, max: max, at: Date.now() };
      } else if (c.kind === 'test') {
        (d.tests[c.id] = d.tests[c.id] || []).push({ score: got, max: max, at: Date.now(), sec: run.sec, mode: c.mode });
      }
      save(d);
      go('#/run');
      route();
    }

    function viewResult() {
      var c = run.cfg, pct = Math.round(run.got / run.max * 100);
      var verdict = pct >= 85 ? t('verdict5') : pct >= 70 ? t('verdict4') : pct >= 50 ? t('verdict3') : t('verdict2');
      var h = '<section class="card p-6 sm:p-8 text-center"><p class="text-[11px] font-black uppercase tracking-widest text-cyan-300">' + esc(c.title) + '</p>' +

        '<p class="mt-1 text-slate-400">' + pct + '% · ' + t('time') + ' ' + fmt(run.sec) + '</p>' +
        '<p class="mt-3 font-bold text-amber-300">' + verdict + '</p>' +
        '<div class="mt-5 flex flex-wrap gap-3 justify-center"><button class="btn btn-main" data-act="again">' + t('again') + '</button>' +
        '<a class="btn btn-sec" href="' + c.back + '">' + (c.kind === 'module' ? t('toModule') : t('toHome')) + '</a>' +
        '<a class="btn btn-sec" href="#/mistakes">🔁 ' + t('mistakes') + '</a></div></section>' +
        '<h2 class="mt-8 mb-3 text-lg font-black">' + t('review') + '</h2><div class="grid gap-3">';
      run.qs.forEach(function (q, i) {
        var g = grade(q, run.ans[i]), m = maxPts(q);
        var col = g === m ? 'border-emerald-500/50' : g > 0 ? 'border-amber-500/50' : 'border-rose-500/50';
        h += '<div class="card p-4 border-2 ' + col + '"><div class="flex justify-between gap-3 text-xs font-bold text-slate-400"><span>' + t('question') + ' ' + (i + 1) + '</span><span>' + g + ' / ' + m + ' ' + t('pts') + '</span></div>' +
          '<p class="mt-1 font-bold text-white whitespace-pre-line">' + esc(pk(q, 'q')) + '</p>' +
          '<p class="mt-2 text-sm"><span class="text-slate-400">' + t('yourAns') + ':</span> <span class="' + (g === m ? 'text-emerald-300' : 'text-rose-300') + '">' + esc(userText(q, run.ans[i])) + '</span></p>' +
          (g === m ? '' : expl(q)) + '</div>';
      });
      $('app').innerHTML = h + '</div>';
    }

    /* ---------- ошибки ---------- */
    function viewMistakes() {
      chrome();
      var d = load(), ids = Object.keys(d.mist).filter(function (k) { return BANK[k]; });
      var h = crumbs([{ t: t('mistakes') }]) + '<h1 class="text-2xl font-black mb-1">🔁 ' + t('mistakes') + '</h1><p class="text-sm text-slate-400 mb-5">' + t('mistDesc') + '</p>';

        ids.map(function (k) { var q = BANK[k]; return '<div class="card p-4"><p class="font-bold text-white whitespace-pre-line">' + esc(pk(q, 'q')) + '</p>' + expl(q) + '</div>'; }).join('') + '</div>';
      $('app').innerHTML = h;

    /* ---------- глоссарий ---------- */
    var gMode = 'list', gQuery = '', gCard = 0, gFlip = false, gDeck = null;
    function viewGlossary() {
      chrome();
      var d = load();
      var h = crumbs([{ t: t('glossary') }]) + '<div class="flex flex-wrap items-center justify-between gap-3 mb-4"><h1 class="text-2xl font-black">📚 ' + t('glossary') + ' <span class="text-slate-500 text-base">(' + TERMS.length + ')</span></h1>' +
        '<div class="flex gap-2"><button class="btn ' + (gMode === 'list' ? 'btn-main' : 'btn-sec') + '" data-act="gmode" data-m="list">' + t('list') + '</button><button class="btn ' + (gMode === 'cards' ? 'btn-main' : 'btn-sec') + '" data-act="gmode" data-m="cards">' + t('cards') + '</button></div></div>';

    function termList() {
      var q = gQuery.trim().toLowerCase();
      var rows = TERMS.filter(function (x) {
        if (!q) return true;
        return (x.x.k + ' ' + x.x.k_ru + ' ' + x.x.d + ' ' + x.x.d_ru).toLowerCase().indexOf(q) >= 0;
      });
      if (!rows.length) return '<p class="text-slate-400 text-sm">' + t('noData') + '</p>';
      return rows.map(function (x) {
        return '<div class="rounded-xl bg-slate-900/80 border border-slate-800 p-3"><div class="flex justify-between gap-2"><b class="text-amber-300 text-sm">' + esc(pk(x.x, 'k')) + '</b><a class="text-[10px] text-slate-500 hover:text-cyan-300" href="#/m/' + x.m + '">№' + x.m + '</a></div><p class="text-sm text-slate-300 mt-1 leading-relaxed">' + esc(pk(x.x, 'd')) + '</p></div>';
      }).join('');
    }

    /* ---------- план и справка ---------- */
    function viewPlan() {
      chrome();
      var plan = P.plan || [];
      var h = crumbs([{ t: t('plan') }]) + '<h1 class="text-2xl font-black mb-4">🗓️ ' + t('plan') + '</h1><div class="grid gap-3">' +
        plan.map(function (w, i) {
          return '<div class="card p-5"><p class="text-xs font-black uppercase tracking-widest text-cyan-300">' + (i + 1) + ' ' + t('weekN') + '</p><h3 class="font-black text-white mt-1">' + esc(pk(w, 'title')) + '</h3>' +
            '<ul class="prose-l mt-1 text-sm">' + pk(w, 'items').map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul></div>';
        }).join('') + '</div>';
      $('app').innerHTML = h;
    }
    function viewInfo() {
      chrome();
      var d = P.info || {};
      $('app').innerHTML = crumbs([{ t: t('info') }]) + '<article class="card p-5 sm:p-8"><h1 class="text-2xl font-black text-white mb-2">ℹ️ ' + t('info') + '</h1><div class="prose-l">' + (pk(d, 'html') || '') + '</div></article>';
    }

    /* ---------- события ---------- */
    document.addEventListener('click', function (e) {
      var b = e.target.closest('[data-act]');
      if (!b) return;
      var act = b.getAttribute('data-act'), id = +b.getAttribute('data-id');
      if (act === 'quiz') return runModuleQuiz(id);
      if (act === 'test') return runTest(id, b.getAttribute('data-mode'));
      if (act === 'mix') return runMix();
      if (act === 'mist') return runMistakes();
      if (act === 'read') {
        var d = load(); if (d.read[id]) delete d.read[id]; else d.read[id] = Date.now();
        save(d); viewModule(id); return;
      }
      if (act === 'reset') {
        if (confirm(t('resetAsk'))) { try { localStorage.removeItem(LS); } catch (x) {} viewHome(); }
        return;
      }
      if (act === 'gmode') { gMode = b.getAttribute('data-m'); gDeck = null; gCard = 0; gFlip = false; return viewGlossary(); }
      if (act === 'gflip') { gFlip = !gFlip; return viewGlossary(); }
      if (act === 'gdont') { gCard++; gFlip = false; return viewGlossary(); }
      if (act === 'gknow') {
        var cur = gDeck[gCard % gDeck.length], dd = load();
        dd.known[cur.m + ':' + cur.x.k] = 1; save(dd);
        gDeck.splice(gCard % gDeck.length, 1); gFlip = false; return viewGlossary();
      }
      if (!run) return;
      var q = run.qs[run.idx];
      if (act === 'opt') {
        var k = +b.getAttribute('data-k');
        if (q.type === 'multi') {
          var a = run.ans[run.idx] || []; var p = a.indexOf(k);
          if (p >= 0) a.splice(p, 1); else a.push(k);
          run.ans[run.idx] = a;
        } else run.ans[run.idx] = k;
        return viewRun();
      }
      if (act === 'check') { run.checked[run.idx] = true; return viewRun(); }
      if (act === 'next') { run.idx = Math.min(run.qs.length - 1, run.idx + 1); return viewRun(); }
      if (act === 'prev') { run.idx = Math.max(0, run.idx - 1); return viewRun(); }
      if (act === 'jump') { run.idx = +b.getAttribute('data-i'); return viewRun(); }
      if (act === 'flag') { run.flags[run.idx] = !run.flags[run.idx]; return viewRun(); }
      if (act === 'finish') {
        var left = run.qs.filter(function (qq, i) { return !answered(qq, run.ans[i]); }).length;
        if (left && !confirm(t('leave').replace('Тест не завершён. Выйти?', (lang === 'ru' ? 'Без ответа: ' : 'Жауапсыз: ') + left + '. ' + (lang === 'ru' ? 'Завершить?' : 'Аяқтаймыз ба?')))) return;
        return finishRun();
      }
      if (act === 'again') {
        var c = run.cfg;
        if (c.kind === 'module') return runModuleQuiz(c.id);
        if (c.kind === 'test') return runTest(c.id, c.mode);
        if (c.kind === 'mix') return runMix();
        return runMistakes();
      }
    });
    document.addEventListener('change', function (e) {
      var s = e.target.closest('[data-act="match"]');
      if (!s || !run) return;
      var a = run.ans[run.idx] || [];
      a[+s.getAttribute('data-i')] = +s.value;
      run.ans[run.idx] = a;
      viewRun();
    });
    $('langSel').addEventListener('change', function (e) {
      lang = e.target.value === 'ru' ? 'ru' : 'kz';
      try { localStorage.setItem(LANGK, lang); } catch (x) {}
      route();
    });
    window.addEventListener('hashchange', route);
    route();
  })();
  </script>
</body>
</html>
