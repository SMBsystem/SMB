  <style id="authCloak">body { display: none !important; }</style>
  <script>
    (function () {
      try {
        var s = null;
        try { s = JSON.parse(localStorage.getItem('geotany_user_session') || 'null'); } catch (e) {}
        var ok = s && s.v === 2 && (s.exp || 0) > Date.now() && s.email && s.courseId === 'infotanu';
        if (!ok) { window.location.replace('../index.html?need_course=infotanu'); return; }
        var c = document.getElementById('authCloak');
        if (c) c.remove();
      } catch (err) { window.location.replace('../index.html'); }
    })();
  </script>

  <style>

    /* ===== панель раздела и карточки — как в GeoTany ===== */
    .ac-emerald { --ac: 52, 211, 153; } .ac-cyan { --ac: 34, 211, 238; } .ac-violet { --ac: 167, 139, 250; }
    .ac-amber { --ac: 251, 191, 36; } .ac-teal { --ac: 45, 212, 191; } .ac-red { --ac: 248, 113, 113; }

    @media (min-width: 1024px) { .sec-tools { width: auto; flex-shrink: 0; } }
    .sec-search { position: relative; flex: 1; min-width: 0; }
    @media (min-width: 1024px) { .sec-search { width: 16rem; flex: none; } }
    .sec-search span { position: absolute; left: .9rem; top: 50%; transform: translateY(-50%); display: flex; color: #64748b; pointer-events: none; transition: color .15s; }
    .sec-search span svg { width: 1rem; height: 1rem; }
    .sec-search:focus-within span { color: rgb(var(--ac)); }
    .sec-search input { width: 100%; height: 100%; min-height: 3.1rem; padding: .6rem .9rem .6rem 2.5rem; background: #0a1020; border: 1px solid #263248; border-radius: .9rem; font-size: .82rem; color: #f1f5f9; outline: none; transition: border-color .15s, box-shadow .15s; }
    .sec-search input::placeholder { color: #64748b; }
    .sec-search input:focus { border-color: rgba(var(--ac), .7); box-shadow: 0 0 0 3px rgba(var(--ac), .15); }
    .sec-track { min-width: 13.5rem; min-height: 3.1rem; padding: .5rem .9rem .55rem; background: #0a1020; border: 1px solid #263248; border-radius: .9rem; display: flex; flex-direction: column; justify-content: center; gap: .4rem; }
    .sec-track-top { display: flex; align-items: baseline; justify-content: space-between; gap: .75rem; white-space: nowrap; }
    .sec-track-num { font-size: 1rem; font-weight: 900; color: #fff; font-variant-numeric: tabular-nums; line-height: 1; }
    .sec-track-num small { font-size: .78rem; font-weight: 700; color: #64748b; margin-left: .15rem; }
    .sec-track-lbl { font-size: .7rem; font-weight: 600; color: #94a3b8; margin-left: .35rem; }
    .sec-track-pct { font-size: .74rem; font-weight: 800; color: rgb(var(--ac)); font-variant-numeric: tabular-nums; }
    .sec-track-bar { height: 4px; border-radius: 9px; background: #1e293b; overflow: hidden; }
    .sec-track-bar i { display: block; height: 100%; border-radius: 9px; background: linear-gradient(90deg, rgba(var(--ac), .65), rgb(var(--ac))); transition: width .4s; }
    .sec-pills { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .9rem; padding-top: .9rem; border-top: 1px solid #1e293b; }
    @media (max-width: 639px) { .sec-pills { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-left: -1rem; margin-right: -1rem; padding-left: 1rem; padding-right: 1rem; } .sec-pills::-webkit-scrollbar { display: none; } .chip-btn { flex-shrink: 0; } }
    .chip-btn { padding: .42rem .8rem; border-radius: .7rem; font-size: .74rem; font-weight: 700; white-space: nowrap; color: #94a3b8; background: #151e2e; border: 1px solid #263248; transition: all .15s; }
    .chip-btn:hover { color: #fff; border-color: #475569; }
    .chip-btn.on { color: #0b0f19; background: rgb(var(--ac)); border-color: rgb(var(--ac)); font-weight: 800; box-shadow: 0 6px 18px -8px rgba(var(--ac), .8); }

    .gc { position: relative; display: flex; flex-direction: column; gap: .8rem; padding: 1.05rem; border-radius: 1.1rem; background: linear-gradient(180deg, #111a2e 0%, #0c1322 100%); border: 1px solid #1e293b; transition: transform .18s, border-color .18s, box-shadow .18s; }
    .gc:hover { transform: translateY(-2px); border-color: rgba(var(--ac), .55); box-shadow: 0 14px 34px -16px rgba(var(--ac), .45); }
    .gc.done { border-color: rgba(52,211,153,.5); }
    .gc-top { display: flex; align-items: flex-start; gap: .75rem; }
    .gc-num { width: 2.6rem; height: 2.6rem; border-radius: .85rem; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: .95rem; color: rgb(var(--ac)); background: rgba(var(--ac), .13); border: 1px solid rgba(var(--ac), .35); }
    .gc.done .gc-num { color: #34d399; background: rgba(52,211,153,.14); border-color: rgba(52,211,153,.4); }
    .gc-kicker { font-size: .66rem; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; color: rgb(var(--ac)); }
    .gc-title { font-size: .95rem; font-weight: 800; color: #fff; line-height: 1.3; margin-top: .1rem; }
    .gc-sub { font-size: .75rem; color: #94a3b8; line-height: 1.5; }
    .gc-status { flex-shrink: 0; font-size: .66rem; font-weight: 800; padding: .2rem .55rem; border-radius: 999px; color: #6ee7b7; background: rgba(52,211,153,.14); border: 1px solid rgba(52,211,153,.35); white-space: nowrap; }
    .gc-status.warn { color: #fcd34d; background: rgba(251,191,36,.14); border-color: rgba(251,191,36,.35); }
    .gc-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .45rem; }
    .gc-stat { background: #0a1020; border: 1px solid #1e293b; border-radius: .7rem; padding: .45rem .3rem; text-align: center; }
    .gc-stat b { display: block; font-size: .9rem; font-weight: 800; color: #fff; line-height: 1.2; }
    .gc-stat span { display: block; font-size: .64rem; color: #94a3b8; margin-top: .1rem; }
    .gc-tags { display: flex; flex-wrap: wrap; gap: .3rem; }
    .gc-tag { font-size: .66rem; color: #94a3b8; background: #0a1020; border: 1px solid #1e293b; border-radius: .45rem; padding: .12rem .45rem; }
    .gc-bar { height: 5px; border-radius: 9px; background: #1e293b; overflow: hidden; }
    .gc-bar i { display: block; height: 100%; border-radius: 9px; background: rgb(var(--ac)); }
    .gc-foot { margin-top: auto; display: flex; align-items: center; gap: .45rem; padding-top: .8rem; border-top: 1px solid #1e293b; flex-wrap: wrap; }
    .gc-btn { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: .4rem; padding: .6rem .8rem; border-radius: .75rem; font-size: .78rem; font-weight: 800; color: #0b0f19; background: rgb(var(--ac)); transition: filter .15s; white-space: nowrap; cursor: pointer; }
    .gc-btn:hover { filter: brightness(1.1); }
    .ac-red .gc-btn { color: #fff; background: #dc2626; }
    .gc-btn2 { flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; gap: .3rem; padding: .6rem .75rem; border-radius: .75rem; font-size: .76rem; font-weight: 800; color: rgb(var(--ac)); background: rgba(var(--ac), .1); border: 1px solid rgba(var(--ac), .32); transition: background .15s; white-space: nowrap; cursor: pointer; }
    .gc-btn2:hover { background: rgba(var(--ac), .2); }
    .gc-btn2.on { color: #0b0f19; background: #34d399; border-color: #34d399; }
    .sec-empty { grid-column: 1 / -1; text-align: center; padding: 2.5rem 1rem; color: #64748b; font-size: .85rem; border: 1px dashed #263248; border-radius: 1rem; }

    /* ===== урок, тест, таблицы ===== */
    .card { background: rgba(15,23,42,.85); border: 1px solid #1e293b; border-radius: 1.4rem; }
    .prose-l p { margin: .55rem 0; line-height: 1.75; color: #cbd5e1; }
    .prose-l ul { list-style: disc; padding-left: 1.3rem; margin: .5rem 0; color: #cbd5e1; }
    .prose-l ol { list-style: decimal; padding-left: 1.3rem; margin: .5rem 0; color: #cbd5e1; }
    .prose-l li { margin: .25rem 0; line-height: 1.65; }
    .prose-l b, .prose-l strong { color: #fde68a; font-weight: 800; }
    .prose-l i, .prose-l em { color: #a5f3fc; }
    .prose-l h4 { margin: .9rem 0 .2rem; font-weight: 800; color: #67e8f9; font-size: .95rem; }
    .prose-l table { width: 100%; border-collapse: collapse; margin: .7rem 0; font-size: .85rem; display: block; overflow-x: auto; }
    .prose-l th, .prose-l td { border: 1px solid #334155; padding: .45rem .6rem; text-align: left; vertical-align: top; }
    .prose-l th { background: #1e293b; color: #67e8f9; }
    .prose-l .note { background: rgba(245,158,11,.1); border: 1px solid rgba(245,158,11,.4); border-radius: .9rem; padding: .7rem .9rem; margin: .8rem 0; color: #fde68a; }
    .prose-l .eq { background: #0a1020; border: 1px solid #263248; border-radius: .8rem; padding: .55rem .8rem; margin: .6rem 0; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .85rem; color: #6ee7b7; overflow-x: auto; }
    .prose-l pre { background: #0a1020; border: 1px solid #263248; border-radius: .8rem; padding: .7rem .9rem; margin: .6rem 0; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .82rem; line-height: 1.55; color: #a5f3fc; overflow-x: auto; white-space: pre; }
    .prose-l code { background: #0a1020; border: 1px solid #263248; border-radius: .4rem; padding: .05rem .35rem; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .82em; color: #6ee7b7; }
    .prose-l pre code { background: none; border: 0; padding: 0; color: inherit; }
    .dual-ru { margin-top: .6rem; padding-top: .6rem; border-top: 1px dashed #334155; color: #94a3b8; }
    .opt { display: flex; gap: .7rem; align-items: flex-start; width: 100%; text-align: left; padding: .75rem .9rem; border-radius: .9rem; border: 2px solid #1e293b; background: #0f172a; transition: border-color .15s; }
    .opt:hover { border-color: #0e7490; }
    .opt.sel { border-color: #22d3ee; background: rgba(34,211,238,.08); }
    .opt.right { border-color: #10b981; background: rgba(16,185,129,.12); }
    .opt.wrong { border-color: #f43f5e; background: rgba(244,63,94,.12); }
    .nav-b { width: 2.1rem; height: 2.1rem; border-radius: .6rem; font-size: .75rem; font-weight: 800; border: 2px solid #334155; color: #94a3b8; }
    .nav-b.ans { background: #0e7490; border-color: #0e7490; color: #fff; }
    .nav-b.cur { border-color: #fbbf24; color: #fbbf24; }
    .nav-b.flag { box-shadow: 0 0 0 2px #f43f5e; }
    .nav-b.ok { background: #059669; border-color: #059669; color: #fff; }
    .nav-b.no { background: #e11d48; border-color: #e11d48; color: #fff; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; padding: .65rem 1.2rem; border-radius: 1rem; font-weight: 800; font-size: .85rem; cursor: pointer; transition: opacity .15s; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn-main { background: linear-gradient(90deg,#3b82f6,#06b6d4,#fbbf24); color: #020617; }
    .btn-sec { background: #1e293b; border: 1px solid #334155; color: #67e8f9; }
    .tbl { width: 100%; border-collapse: collapse; font-size: .85rem; }
    .tbl th { background: #1e293b; color: #67e8f9; text-align: left; padding: .55rem .7rem; border: 1px solid #334155; font-weight: 800; }
    .tbl td { border: 1px solid #263248; padding: .5rem .7rem; vertical-align: top; color: #cbd5e1; line-height: 1.55; }
    .tbl td:first-child { color: #fde68a; font-weight: 700; }
    .tbl tr:nth-child(even) td { background: rgba(15,23,42,.6); }
    .hide-mode td.c:not(.rev) { cursor: pointer; background: #151e2e !important; }
    .hide-mode td.c:not(.rev) span { filter: blur(7px); opacity: .55; user-select: none; }
    .flipcard { min-height: 14rem; }

    /* ===== схемы ===== */
    .dg { width: 100%; height: auto; max-height: 30rem; background: #0a1020; border-radius: 1rem; border: 1px solid #1e293b; }
    .dg text { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    .dg .lbl { font-size: 11px; fill: #94a3b8; }
    .dg [data-p] { transition: filter .2s, stroke .2s; }
    .dg .mk { cursor: pointer; }
    .dg .mk circle { fill: #0f172a; stroke: #fbbf24; stroke-width: 2; }
    .dg .mk text { fill: #fde68a; font-size: 11px; font-weight: 800; text-anchor: middle; pointer-events: none; }
    .dg .mk.on circle { fill: #fbbf24; }
    .dg .mk.on text { fill: #0b0f19; }
    .dg .mk.hid circle { fill: #0f172a; stroke: #475569; }
    .dg .mk.hid text { fill: #94a3b8; }
    .part-row { display: flex; gap: .7rem; align-items: flex-start; width: 100%; text-align: left; padding: .6rem .75rem; border-radius: .8rem; border: 1px solid #1e293b; background: #0f172a; transition: border-color .15s; cursor: pointer; }
    .part-row:hover { border-color: #0e7490; }
    .part-row.on { border-color: #fbbf24; background: rgba(251,191,36,.08); }
    .part-n { flex-shrink: 0; width: 1.7rem; height: 1.7rem; border-radius: 999px; background: #0f172a; border: 2px solid #fbbf24; color: #fde68a; font-weight: 800; font-size: .72rem; display: flex; align-items: center; justify-content: center; }
    .part-row.on .part-n { background: #fbbf24; color: #0b0f19; }

    /* прогресс-окно */
    .modal-bg { position: fixed; inset: 0; z-index: 90; background: rgba(2,6,23,.8); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .modal-bg.hidden { display: none; }
    .rad-a { fill: rgba(52,211,153,.25); stroke: #34d399; stroke-width: 2; }
  </style>

    function grade(q, a) {
      if (a == null) return 0;

        if (!a.length) return 0;

        q.options.forEach(function (_, i) { if ((a.indexOf(i) >= 0) !== (q.answer.indexOf(i) >= 0)) err++; });
        return err === 0 ? 2 : err === 1 ? 1 : 0;
      }
      var s = 0;

    }

      PARTS.forEach(function (k, i) {
        var a = -Math.PI / 2 + i * 2 * Math.PI / n, v = Math.max(vals[k], 3) / 100;
        axes += '<line x1="' + cx + '" y1="' + cy + '" x2="' + (cx + R * Math.cos(a)).toFixed(1) + '" y2="' + (cy + R * Math.sin(a)).toFixed(1) + '" stroke="#263248"/>';
        pts.push((cx + R * v * Math.cos(a)).toFixed(1) + ',' + (cy + R * v * Math.sin(a)).toFixed(1));
        var lx = cx + (R + 24) * Math.cos(a), ly = cy + (R + 20) * Math.sin(a);

      });

      if (act === 'dagain') { dState.qs = []; return viewDiagram(B.diag[dState.id]); }
      if (act === 'dpick') {
        var dg = B.diag[dState.id], cq = dState.qs[dState.i], n2 = +b.getAttribute('data-n');
        dState.picked = dg.parts.filter(function (p) { return p.n === n2; })[0];
        if (dState.picked === cq.p) { dState.ok++; var dx = load(); awardOnce('dq' + dg.id + ':' + n2, 2, dx); save(dx); }
        return viewDiagram(dg);
      }
      if (act === 'dnext') {
        var dg2 = B.diag[dState.id];
        dState.picked = null;
        if (dState.i < dState.qs.length - 1) dState.i++;
        else {
          dState.done = true;
          var dz = load(), sc = pct(dState.ok, dState.qs.length), pr = dz.diag[dg2.id];
          if (!pr || sc > pr.best) dz.diag[dg2.id] = { best: sc, at: Date.now() };
          if (sc >= 80) awardOnce('dpass' + dg2.id, 25, dz);
          save(dz); hud(dz);
        }
        return viewDiagram(dg2);
      }
      if (!run) return;
      var q = run.qs[run.idx];
      if (act === 'opt') {
        var k = +b.getAttribute('data-k');
        if (q.type === 'multi') { var a = run.ans[run.idx] || [], p = a.indexOf(k); if (p >= 0) a.splice(p, 1); else a.push(k); run.ans[run.idx] = a; }
        else run.ans[run.idx] = k;
        return viewRun();
      }
      if (act === 'check') { run.checked[run.idx] = true; return viewRun(); }
      if (act === 'next') { run.idx = Math.min(run.qs.length - 1, run.idx + 1); return viewRun(); }
      if (act === 'prev') { run.idx = Math.max(0, run.idx - 1); return viewRun(); }
      if (act === 'jump') { run.idx = +b.getAttribute('data-i'); return viewRun(); }
      if (act === 'flag') { run.flags[run.idx] = !run.flags[run.idx]; return viewRun(); }
      if (act === 'finish') {
        var left = run.qs.filter(function (qq, i) { return !answered(qq, run.ans[i]); }).length;
        if (left && !confirm(t('leave') + ': ' + left + '. ' + t('leaveQ'))) return;
        return finishRun();
      }
      if (act === 'again') {
        var cf = run.cfg;
        if (cf.kind === 'module') return runModuleQuiz(cf.id);
        if (cf.kind === 'test') return runTest(cf.id, cf.mode);
        if (cf.kind === 'mix') return runMix();
        if (cf.kind === 'prob') return runProb(cf.cat);
        if (cf.kind === 'blitz') return runBlitz(cf.id);
        return runMist();
      }
    });
    document.addEventListener('change', function (e) {
      var s = e.target.closest('[data-act="match"]');
      if (s && run) { var a = run.ans[run.idx] || []; a[+s.getAttribute('data-i')] = +s.value; run.ans[run.idx] = a; return viewRun(); }
      var c = e.target.closest('[data-act="talkChk"]');
      if (c) { talkState.chk[+c.getAttribute('data-i')] = c.checked; return route(); }
    });
    $('langSel').addEventListener('change', function (e) {
      lang = e.target.value === 'ru' ? 'ru' : 'kz';
      lLang = lang;
      try { localStorage.setItem(LANGK, lang); localStorage.setItem(LANGL, lLang); } catch (x) {}
      route();
    });
    window.addEventListener('hashchange', route);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });
    route();
  })();
  </script>
</body>
</html>
