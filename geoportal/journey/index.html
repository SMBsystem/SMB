<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <title>Шошо жолы · Путь Шошо</title>
  <meta name="description" content="Вебтун: восемь дорог, туман и коды от преподавателя.">
  <meta name="theme-color" content="#07070d">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,400;0,500;0,700;0,900;1,700;1,900&display=swap');
    :root { --ink:#f4f6ff; --muted:#aab3cf; --accent:#ffd36b; --hud:50px; }
    * { box-sizing:border-box; }
    body { margin:0; background:#07070d; color:var(--ink); font-family:'Rubik',system-ui,sans-serif; overflow-x:hidden; transition:background-color 1.2s; }
    button, input, select { font:inherit; }

    /* верхняя панель */
    #hud { position:fixed; top:0; left:0; right:0; height:var(--hud); z-index:30; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:0 14px; background:linear-gradient(rgba(5,5,12,.85), rgba(5,5,12,0)); }
    #hud .brand { font-weight:900; font-size:13px; letter-spacing:.04em; white-space:nowrap; }
    #nodes { display:flex; align-items:center; }
    .node { width:24px; height:24px; border-radius:50%; border:2px solid rgba(255,255,255,.28); background:rgba(8,12,28,.6); color:rgba(255,255,255,.5); font-size:10px; font-weight:900; display:grid; place-items:center; padding:0; cursor:default; flex:none; transition:all .4s; }
    .node + .node { margin-left:12px; position:relative; }
    .node + .node::before { content:''; position:absolute; right:100%; top:50%; width:12px; height:2px; background:rgba(255,255,255,.2); transform:translateY(-50%); }
    .node.open { background:var(--c,var(--accent)); border-color:#fff; color:#10131f; cursor:pointer; }
    .node.cur { box-shadow:0 0 0 4px rgba(255,255,255,.2), 0 0 16px var(--c,var(--accent)); transform:scale(1.15); }
    #langSel { background:rgba(8,12,28,.7); color:var(--ink); border:1px solid rgba(255,255,255,.25); border-radius:10px; padding:4px 8px; font-weight:700; font-size:12px; cursor:pointer; }
    #bar { position:fixed; top:0; left:0; height:3px; width:0; z-index:31; background:linear-gradient(90deg,#7ce6b4,#6fd3f2,#ffd36b); }
    #flash { position:fixed; inset:0; z-index:40; background:#fff; opacity:0; pointer-events:none; }
    #flash.go { animation:flash .9s ease-out; }
    @keyframes flash { 0% { opacity:0; } 12% { opacity:.95; } 100% { opacity:0; } }

    /* лента */
    /* страница заканчивается ровно на последнем элементе: пустого чёрного хвоста после шлюза нет */
    #strip { max-width:720px; margin:0 auto; padding-top:calc(var(--hud) + 18px); padding-bottom:28px; box-shadow:0 0 120px rgba(0,0,0,.65); }
    #strip:has(> .gatep:last-child) { padding-bottom:0; }
    .panel { position:relative; overflow:hidden; container-type:inline-size; background:#000; opacity:0; transform:translateY(34px); transition:opacity .7s ease, transform .7s ease; }
    .panel.in { opacity:1; transform:none; }
    .g-s { margin-bottom:6px; } .g-m { margin-bottom:30px; } .g-l { margin-bottom:96px; } .g-xl { margin-bottom:180px; }
    .art { position:absolute; inset:-7% 0; will-change:transform; }
    .art > * { position:absolute; inset:0; }
    .art img { width:100%; height:100%; object-fit:cover; display:block; }
    .art:has(img) { inset:0; }
    .panel.crop-b .art img { object-position:50% 100%; }
    .panel.fade-b { -webkit-mask-image:linear-gradient(#000 84%, transparent); mask-image:linear-gradient(#000 84%, transparent); }
    /* текстовый «бит»: повествование на тёмном фоне под картинкой */
    .panel.beat { background:none; overflow:visible; }
    .beat .bi { margin:0 6cqw; padding-left:5cqw; border-left:3px solid var(--acc); }
    .beat .b { margin:0 0 1.15em; font-size:clamp(17px,4.4cqw,27px); line-height:1.62; font-weight:400; color:#f2eee2; text-wrap:pretty; opacity:0; transform:translateY(16px); transition:opacity .8s ease var(--d,0s), transform .8s ease var(--d,0s); }
    .beat .b:last-child { margin-bottom:0; }
    .beat .b.q { font-style:italic; font-weight:500; color:#fff; text-shadow:0 0 24px var(--acc); }
    .panel.in .b { opacity:1; transform:none; }
    /* туман поверх картинки (кадр с дюнами): два пятна медленно плывут */
    .panel .fog { position:absolute; inset:-10%; z-index:2; pointer-events:none; filter:blur(18px); opacity:.85;
      background:radial-gradient(55% 38% at 18% 62%, rgba(236,236,230,.55), transparent 70%), radial-gradient(50% 34% at 82% 38%, rgba(236,236,230,.45), transparent 70%); animation:fogdrift 18s ease-in-out infinite alternate; }
    @keyframes fogdrift { from { translate:-4% 1%; } to { translate:5% -2%; } }
    .panel.void { background:none; overflow:visible; }
    .void i { position:absolute; left:50%; top:50%; width:10px; height:10px; margin:-5px 0 0 -5px; border-radius:50%; background:#ffd36b; box-shadow:0 0 28px 10px rgba(255,211,107,.55); opacity:0; }
    .panel.in.dot i { animation:dotpulse 2.6s ease-in-out infinite; }
    @keyframes dotpulse { 0%,100% { opacity:.15; transform:scale(.7); } 50% { opacity:1; transform:scale(1.5); } }
    /* «голос» под кадром: без рамки, по центру, курсив, свечение */
    .beat .bi.vb { border:0; padding:4cqw 0; }
    .beat .b.v { text-align:center; font-style:italic; font-weight:600; font-size:clamp(19px,5cqw,31px); line-height:1.4; color:#eaf1ff; text-shadow:0 0 30px rgba(120,160,255,.85), 0 2px 10px rgba(0,0,0,.8); }
    .beat .b.v small { display:block; font-style:normal; font-weight:900; font-size:.5em; letter-spacing:.35em; text-transform:uppercase; color:#9fb8ff; margin-bottom:.6em; text-shadow:none; }
    .beat em { font-style:normal; font-weight:600; color:var(--acc); text-shadow:0 0 18px color-mix(in srgb, var(--acc) 45%, transparent); }
    .beat .b.q em { color:#fff; }
    /* кино-эффект: медленное приближение и мягкая виньетка на готовых картинках */
    .art:has(img)::after { content:''; position:absolute; inset:0; box-shadow:inset 0 0 90px rgba(0,0,0,.5); pointer-events:none; }
    .panel.in .art img { animation:kb 18s ease-out both; transform-origin:50% 40%; }
    @keyframes kb { from { scale:1; } to { scale:1.07; } }
    @media (prefers-reduced-motion: reduce) { .panel.in .art img { animation:none; } }
    .sc svg { position:absolute; left:0; top:0; width:100%; height:60%; }
    .bu { background:#fff; }
    .bu svg { width:100%; height:100%; display:block; -webkit-mask-image:radial-gradient(circle at 50% 46%, transparent 24%, #000 62%); mask-image:radial-gradient(circle at 50% 46%, transparent 24%, #000 62%); }
    .dk { background:radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--g) 38%, #000) 0%, #05060c 62%); }
    .hero { position:absolute !important; inset:auto !important; }
    .hero svg { width:100%; height:auto; display:block; overflow:visible; filter:drop-shadow(0 6px 14px rgba(0,0,0,.35)); }
    .hero.close { width:116%; left:-8%; bottom:-30%; }
    .hero.bust { width:54%; bottom:-6%; } .hero.bust.l { left:3%; } .hero.bust.r { right:3%; }
    .panel.in .hero.close { animation:breath 4s ease-in-out infinite; transform-origin:50% 100%; }
    @keyframes breath { 50% { transform:scale(1.015); } }

    /* вспышка и тряска кадра */
    .panel .fl { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:5; }
    .panel.in.fx-flash .fl { animation:flash .8s ease-out .15s; }
    .panel.in.fx-shake { animation:shake .55s .2s; }
    @keyframes shake { 15% { transform:translate(-7px,4px); } 30% { transform:translate(6px,-5px); } 45% { transform:translate(-5px,-3px); } 60% { transform:translate(4px,5px); } 80% { transform:translate(-2px,1px); } }

    /* надписи */
    .ov { position:absolute; inset:0; z-index:3; }
    .it { position:absolute; opacity:0; transform:scale(.7); transition:opacity .35s ease, transform .45s cubic-bezier(.3,1.6,.5,1); transition-delay:var(--d,0s); }
    .panel.in .it { opacity:1; transform:none; }
    .nar { background:#fff6d2; color:#161616; border:3px solid #111; padding:2.2cqw 3cqw; font-weight:500; font-size:clamp(13px,3.4cqw,23px); line-height:1.45; box-shadow:5px 5px 0 rgba(0,0,0,.55); transform:translateY(-14px); }
    .nar.big { font-size:clamp(24px,8cqw,56px); font-weight:900; text-align:center; background:none; border:0; box-shadow:none; color:#fff; text-shadow:0 4px 30px rgba(120,150,255,.8); }
    .nar.big.dark { color:#241a0a; text-shadow:0 1px 0 rgba(255,255,255,.7); font-size:clamp(15px,4.4cqw,32px); line-height:1.15; padding:0; }
    .say { background:#fff; color:#111; border:3px solid #111; border-radius:50% / 46%; padding:3.4cqw 4.6cqw; text-align:center; font-weight:700; font-size:clamp(14px,3.8cqw,26px); line-height:1.3; }
    .say::after { content:''; position:absolute; width:5cqw; height:5cqw; background:#fff; border:3px solid #111; border-top:0; border-left:0; transform:rotate(45deg); bottom:-2.4cqw; }
    .say.tail-bl::after { left:14%; } .say.tail-br::after { right:14%; }
    /* голос поверх кадра: без рамки, только текст со свечением и тёмной тенью */
    .voice { color:#eaf1ff; text-align:center; font-weight:700; font-style:italic; font-size:clamp(16px,4.6cqw,32px); line-height:1.4; padding:2cqw 3cqw; text-shadow:0 0 28px rgba(120,160,255,.9), 0 2px 8px rgba(0,0,0,.9), 0 0 2px #000; }
    .voice small { display:block; font-size:.55em; letter-spacing:.3em; text-transform:uppercase; color:#9fb8ff; margin-bottom:.4em; font-style:normal; }
    .sfx { font-weight:900; font-style:italic; color:#fff; font-size:calc(var(--s) * 1cqw); letter-spacing:.02em; -webkit-text-stroke:calc(var(--s) * .16cqw) #111; paint-order:stroke fill; text-shadow:calc(var(--s) * .22cqw) calc(var(--s) * .22cqw) 0 #111, 0 0 0 #111; rotate:calc(var(--r) * 1deg); white-space:nowrap; color:#ffe14a; }
    .panel.in .sfx { animation:stamp .45s cubic-bezier(.2,1.8,.4,1) both; animation-delay:var(--d,0s); }
    @keyframes stamp { from { opacity:0; transform:scale(2.4); } to { opacity:1; transform:none; } }
    .title { text-align:center; transform:none; }
    .title i { display:block; font-style:normal; font-weight:900; letter-spacing:.35em; font-size:clamp(11px,2.8cqw,18px); color:var(--accent); text-shadow:0 2px 12px #000; text-transform:uppercase; }
    .title b { display:block; font-size:clamp(28px,9cqw,62px); font-weight:900; line-height:1.05; margin-top:.2em; -webkit-text-stroke:2px #0a0a14; paint-order:stroke fill; text-shadow:0 6px 30px rgba(0,0,0,.6); }

    /* специальные кадры */
    .block { padding:46px 20px; text-align:center; background:linear-gradient(#05060c, #0b1024); }
    .block h2 { font-size:clamp(26px,6vw,38px); margin:0 0 8px; font-weight:900; }
    .block > p { color:#cdd6f0; line-height:1.55; margin:0 auto 20px; max-width:30rem; }
    .courses { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; text-align:left; }
    .course { display:flex; flex-direction:column; gap:6px; padding:14px 16px; border-radius:6px; background:#fff6d2; color:#161616; border:3px solid #111; text-decoration:none; box-shadow:5px 5px 0 rgba(0,0,0,.6); transition:transform .2s; }
    a.course:hover { transform:translate(-2px,-2px); }
    .course b { font-size:15px; } .course span { font-size:13px; line-height:1.5; color:#3b3b3b; flex:1; }
    .course em { font-style:normal; font-size:12px; font-weight:900; color:#a3361d; }
    .course.soon em { color:#7a7a7a; }
    .startp { min-height:78svh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px 20px; background:radial-gradient(circle at 50% 40%, #1a2650, #05060c 70%); }
    .startp .kicker { font-size:11px; font-weight:900; letter-spacing:.3em; text-transform:uppercase; color:var(--accent); margin:0 0 12px; }
    .startp h1 { font-size:clamp(42px,12vw,86px); line-height:1; margin:0 0 10px; font-weight:900; -webkit-text-stroke:2px #05060c; paint-order:stroke fill; text-shadow:0 8px 40px rgba(100,140,255,.7); }
    .startp .sub { color:var(--muted); margin:0 0 26px; }
    .btn { display:inline-block; border:0; cursor:pointer; text-decoration:none; padding:14px 30px; border-radius:999px; font-weight:900; font-size:15px; color:#12192c; background:linear-gradient(90deg,#7ce6b4,#6fd3f2,#ffd36b); box-shadow:0 10px 30px rgba(0,0,0,.4); transition:transform .2s; }
    .btn:hover { transform:translateY(-2px); }
    .hint { color:var(--muted); font-size:14px; animation:pulse 2.2s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity:.4; } }
    #prog { position:fixed; top:var(--hud); left:50%; transform:translateX(-50%); z-index:29; display:none; align-items:center; gap:4px; padding:5px 12px; border-radius:999px; background:rgba(5,5,12,.72); backdrop-filter:blur(6px); border:1px solid rgba(255,255,255,.18); font-size:11px; }
    #prog span { color:var(--muted); margin-right:4px; font-weight:500; } #prog b { margin-left:6px; font-weight:900; }
    #prog i { width:11px; height:11px; border-radius:3px; border:2px solid rgba(255,255,255,.4); transition:all .3s; }
    #prog i.on { background:var(--accent); border-color:var(--accent); box-shadow:0 0 8px var(--accent); }
    .cardp { display:flex; align-items:center; justify-content:center; padding:56px 20px; background:radial-gradient(circle at 50% 50%, #1b2554, #05060c 70%); }
    .cc { position:relative; width:min(100%,26rem); text-align:center; padding:34px 22px 22px; background:#fff6d2; color:#161616; border:3px solid #111; border-radius:6px; box-shadow:7px 7px 0 rgba(0,0,0,.6), 0 0 60px rgba(255,211,107,.45); transform:scale(.8) rotate(-2deg); opacity:0; transition:transform .7s cubic-bezier(.3,1.6,.5,1) .25s, opacity .4s .25s; }
    .panel.in .cc { transform:none; opacity:1; }
    .cc .ribbon { position:absolute; top:-15px; left:50%; transform:translateX(-50%); background:#e03a3e; color:#fff; font-weight:900; font-size:12px; letter-spacing:.14em; text-transform:uppercase; padding:5px 14px; border:3px solid #111; white-space:nowrap; }
    .cc .cn { font-size:13px; font-weight:900; letter-spacing:.3em; color:#a3361d; }
    .cc h3 { font-size:clamp(21px,5.6vw,28px); margin:6px 0 8px; font-weight:900; line-height:1.15; }
    .cc p { margin:0 0 16px; font-size:14px; line-height:1.55; color:#333; }
    .cc .acts { display:flex; gap:10px; justify-content:center; align-items:center; flex-wrap:wrap; }
    .cc .soon { font-size:12px; font-weight:900; color:#777; padding:8px 14px; border:2px dashed #999; border-radius:999px; }
    .cc .btn { padding:9px 20px; font-size:13px; }
    /* карточка-портал: обложка, список баз */
    .cc.portal { padding-top:0; }
    .cc .cover { display:block; width:calc(100% + 44px); margin:0 -22px 16px; aspect-ratio:16/9; object-fit:cover; border-bottom:3px solid #111; border-radius:3px 3px 0 0; }
    .cc .bl { font-size:11px; font-weight:900; letter-spacing:.2em; text-transform:uppercase; color:#7a5a1a; margin-top:6px; }
    .cc .bases { list-style:none; margin:6px 0 14px; padding:0; display:flex; flex-wrap:wrap; gap:6px; justify-content:center; }
    .cc .bases li { font-size:12px; font-weight:700; padding:4px 10px; border:2px solid #111; border-radius:999px; background:#fff; }
    /* окно «история пишется» */
    #modal { position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center; padding:20px; background:rgba(3,4,10,.78); backdrop-filter:blur(4px); }
    #modal[hidden] { display:none; }
    .mbox { position:relative; width:min(100%,26rem); background:#fff6d2; color:#161616; border:3px solid #111; border-radius:6px; padding:30px 22px 22px; box-shadow:7px 7px 0 rgba(0,0,0,.6); text-align:center; }
    .mbox h3 { margin:0 0 10px; font-size:20px; font-weight:900; line-height:1.2; }
    .mbox p { margin:0; font-size:14px; line-height:1.55; color:#333; }
    .mbox .mx { position:absolute; top:4px; right:8px; border:0; background:none; font-size:26px; line-height:1; cursor:pointer; color:#111; }
    .chk { cursor:pointer; padding:9px 16px; border-radius:999px; border:3px solid #111; background:#fff; font-weight:900; font-size:13px; color:#111; }
    .chk.on { background:#7ce6b4; }
    .endc { padding:30px 20px 60px; display:flex; justify-content:center; background:#05060c; }
    .endc .box { max-width:28rem; text-align:center; background:#fff6d2; color:#161616; border:3px solid #111; padding:18px 22px; box-shadow:6px 6px 0 rgba(0,0,0,.6); }
    .endc b { display:block; font-size:19px; margin-bottom:6px; color:#a3361d; }
    .endc p { margin:0 0 14px; font-size:15px; line-height:1.5; }
    .endc .btn { padding:10px 22px; font-size:14px; }

    /* туман, замок, код */
    .gatep { position:relative; overflow:hidden; min-height:100svh; display:flex; align-items:center; justify-content:center; padding:40px 20px; text-align:center; background:linear-gradient(#05060c, #1b2236 40%, #d6dfee); }
    .fb { position:absolute; width:120vmin; height:80vmin; border-radius:50%; background:radial-gradient(closest-side, rgba(230,237,248,.95), rgba(230,237,248,.5) 55%, rgba(230,237,248,0)); filter:blur(6px); transition:transform 1.5s cubic-bezier(.6,0,.3,1), opacity 1.5s; animation:drift 24s ease-in-out infinite alternate; pointer-events:none; }
    .fb:nth-child(1) { left:-30%; top:2%; } .fb:nth-child(2) { right:-30%; top:20%; animation-delay:-8s; } .fb:nth-child(3) { left:-20%; bottom:-10%; animation-delay:-14s; } .fb:nth-child(4) { right:-25%; bottom:-8%; animation-delay:-4s; } .fb:nth-child(5) { left:20%; top:34%; width:90vmin; animation-delay:-11s; }
    @keyframes drift { from { translate:-4% 0; } to { translate:6% 3%; } }
    .gatep.parting .fb:nth-child(odd) { transform:translateX(-140%); opacity:0; }
    .gatep.parting .fb:nth-child(even) { transform:translateX(140%); opacity:0; }
    .gatep .in { position:relative; z-index:2; max-width:26rem; width:100%; }
    .lock { width:112px; margin:0 auto 10px; display:block; overflow:visible; filter:drop-shadow(0 10px 24px rgba(0,0,0,.45)); }
    .lock .shackle { fill:none; stroke:#d7dce8; stroke-width:10; stroke-linecap:round; transition:transform .8s cubic-bezier(.3,1.5,.5,1); transform-box:view-box; transform-origin:86px 62px; }
    .lock .ring { fill:none; stroke:#ffd36b; stroke-width:3; opacity:0; transform-box:fill-box; transform-origin:center; }
    .lock.open .shackle { transform:translateY(-16px) rotate(-32deg); }
    .lock.open .ring { animation:ring 1.1s ease-out; }
    .lock.open .keyhole { fill:#ffd36b; }
    .lock.shake { animation:lshake .45s; } .lock.passed { opacity:.6; }
    @keyframes ring { from { opacity:.95; transform:scale(.6); } to { opacity:0; transform:scale(3.4); } }
    @keyframes lshake { 20%,60% { transform:translateX(-9px); } 40%,80% { transform:translateX(9px); } }
    .gatep h3 { font-size:25px; margin:6px 0 8px; font-weight:900; color:#101626; text-shadow:0 1px 0 rgba(255,255,255,.5); }
    .gatep p { color:#26314d; line-height:1.55; margin:0 0 16px; font-weight:500; }
    .gatep form { display:flex; gap:10px; }
    .gatep input { flex:1; min-width:0; padding:13px 16px; border-radius:999px; border:2px solid rgba(16,22,38,.4); background:rgba(255,255,255,.88); color:#101626; text-align:center; font-weight:900; letter-spacing:.14em; text-transform:uppercase; outline:none; }
    .gatep input:focus { border-color:#2b86b8; }
    .gatep input::placeholder { text-transform:none; letter-spacing:0; font-weight:500; color:#6c7893; }
    .gatep .btn { padding:13px 22px; }
    .err { min-height:20px; margin-top:10px; font-size:13px; font-weight:900; color:#a8173a; }
    /* шлюз с готовой картинкой (туман и замок нарисованы на ней) */
    .gatep.img { align-items:flex-end; padding-bottom:34px; background:#0d1a1c; }
    .gatep.img::before { content:''; position:absolute; inset:0; background:var(--gimg) center top/cover no-repeat; transition:opacity 1.6s ease, transform 1.6s ease; }
    .gatep.img::after { content:''; position:absolute; inset:0; background:linear-gradient(rgba(7,14,16,0) 38%, rgba(7,14,16,.82) 78%); pointer-events:none; }
    .gatep.img.parting::before { opacity:0; transform:scale(1.18); }
    .gatep.img .fb, .gatep.img .lock { display:none; }
    .gatep.img h3 { color:#fff; text-shadow:0 2px 14px rgba(0,0,0,.7); }
    .gatep.img p { color:#dbe7ea; text-shadow:0 1px 8px rgba(0,0,0,.7); }
    /* пройденный шлюз: тонкий разделитель */
    .gatep.passed { min-height:0; padding:38px 20px; background:none; }
    .gatep.passed .in { display:flex; align-items:center; gap:14px; max-width:30rem; }
    .gatep.passed .gl { flex:1; height:2px; background:linear-gradient(90deg, transparent, var(--accent)); box-shadow:0 0 14px rgba(255,211,107,.6); }

      return '<svg class="lock' + (passed ? ' open passed' : '') + '" viewBox="0 0 120 140" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#d9a032"/></linearGradient></defs><circle class="ring" cx="60" cy="92" r="30"/><path class="shackle" d="M34 64 V46 a26 26 0 0 1 52 0 V64"/><rect x="20" y="62" width="80" height="64" rx="14" fill="url(#lg)"/><circle class="keyhole" cx="60" cy="88" r="8" fill="#2b2230"/><rect x="56.5" y="90" width="7" height="18" rx="3" fill="#2b2230"/></svg>';
    }
    function titleHTML() {
      var u = U();
      var bg = J.cover && (J.images || []).indexOf(J.cover) > -1;   // обложка под титулом
      return '<div class="panel startp g-s' + (bg ? ' hasbg' : '') + '" data-id="title"' + (bg ? ' style="--cover:url(' + J.imgDir + J.cover + '.' + J.imgExt + ')"' : '') + '><p class="kicker">' + esc(u.introKicker) + '</p><h1>' + esc(u.title) + '</h1><p class="sub">' + esc(u.sub) + '</p><p class="hint">' + esc(u.hint) + '</p></div>';
    }
    // Прохождение курсов: отметки хранятся в этом браузере
    var done = [];
    try { var dd = JSON.parse(localStorage.getItem(J.doneKey) || '[]'); if (Array.isArray(dd)) done = dd; } catch (e) {}
    function saveDone() { try { localStorage.setItem(J.doneKey, JSON.stringify(done)); } catch (e) {} }
    function courseCardHTML(ch, k) {
      var ep = CH[ch].episodes[k], u = U(), key = ch + '-' + k, isDone = done.indexOf(key) > -1;
      return '<div class="panel cardp g-l" data-id="card' + key + '"><div class="cc"><div class="ribbon">' + esc(u.newCourse) + '</div><div class="cn">' + ch + '.' + (k + 1) + '</div><h3>' + esc(ep.name[lang]) + '</h3><p>' + esc(ep.desc[lang]) + '</p><div class="acts">' +
        (ep.link ? '<a class="btn" href="' + esc(ep.link) + '" target="_blank" rel="noopener">' + esc(u.openCourse) + '</a>' : '<span class="soon">' + esc(u.soon) + '</span>') +
        '<button class="chk' + (isDone ? ' on' : '') + '" data-key="' + key + '">' + esc(isDone ? u.isDone : u.markDone) + '</button></div></div></div>';
    }
    // Сколько курсов (карточек) в главе: у главы со story — карточки, иначе эпизоды
    function courseCount(c) { return c.story ? c.story.filter(function (p) { return p.card; }).length : c.episodes.length; }
    // Карточка-портал главы со story: обложка, список баз, кнопка «Читать историю» (link пусто → окно «история пишется»)
    function storyCardHTML(ch, k, p) {
      var c = p.card, u = U(), key = ch + '-' + k, isDone = done.indexOf(key) > -1, hasImg = c.img && (J.images || []).indexOf(c.img) > -1;
      var bases = (c.bases && c.bases[lang] || []).map(function (b) { return '<li>' + esc(b) + '</li>'; }).join('');
      return '<div class="panel cardp g-' + (p.gap || 'l') + '" data-id="card' + key + '"><div class="cc portal">' + (hasImg ? '<img class="cover" src="' + J.imgDir + c.img + '.' + J.imgExt + '" alt="">' : '') +
        '<div class="ribbon">' + esc(u.portal) + '</div><div class="cn">' + ch + '.' + (k + 1) + '</div><h3>' + esc(c.name[lang]) + '</h3>' +
        (bases ? '<div class="bl">' + esc(u.basesLabel) + '</div><ul class="bases">' + bases + '</ul>' : '') + '<p>' + esc(c.desc[lang]) + '</p><div class="acts">' +
        (c.link ? '<a class="btn" href="' + esc(c.link) + '" target="_blank" rel="noopener">' + esc(c.btn[lang]) + '</a>' : '<button class="btn story" type="button" data-title="' + esc(c.name[lang]) + '">' + esc(c.btn[lang]) + '</button>') +
        '<button class="chk' + (isDone ? ' on' : '') + '" data-key="' + key + '">' + esc(isDone ? u.isDone : u.markDone) + '</button></div></div></div>';
    }
    // Эпизод = три кадра комикса (сцена, реплика, вывод) + карточка курса
    function episodePanels(ch, k) {
      var ep = CH[ch].episodes[k], id = (ch ? 'c' + ch : '') + 'e' + (k + 1) + '-', sky = SCENES[ep.scene].sky[2];
      return [
        { id: id + '1', ratio: '4/5', gap: 'm', art: { type: 'scene', scene: ep.scene, hero: 'l', expr: 'neutral' }, items: [
          { k: 'title', y: 5, num: J.ui[lang].level + ' ' + (k + 1) + ' · ' + CH[ch].name[lang], kz: ep.name.kz, ru: ep.name.ru }, { k: 'nar', x: 42, y: 50, w: 54, kz: ep.nar.kz, ru: ep.nar.ru }] },
        { id: id + '2', ratio: '1/1', gap: 'm', fx: 'flash shake', art: { type: 'burst', expr: ep.expr, crop: 'close' }, items: [
          { k: 'sfx', x: 4, y: 5, rot: -9, size: 22, kz: ep.sfx.kz, ru: ep.sfx.ru }, { k: 'say', x: 46, y: 3, w: 49, tail: 'bl', kz: ep.say.kz, ru: ep.say.ru }] },
        { id: id + '3', ratio: '4/5', gap: 'm', fx: 'flash', art: { type: 'dark', glow: sky }, items: [{ k: 'nar', x: 8, y: 38, w: 84, kz: ep.insight.kz, ru: ep.insight.ru }] }
      ];
    }
    // part: 'intro' — только пролог (виден всем до кода), 'rest' — глава после шлюза (эпизоды, финал главы)
    function chapterHTML(n, part) {
      var c = CH[n], u = U(), h = '<section class="chap"' + (part === 'rest' ? ' id="chapRest"' : '') + ' data-ch="' + n + '">';
      // титул главы: у глав 1–8 всегда, у главы 0 — после шлюза (пролог идёт без него)
      // фон титула — обложка раздела (c.cover), затемнённая; без обложки — тёмный кадр со свечением
      if (n > 0 || part === 'rest') h += panelHTML({ id: 't' + n, img: c.cover, shade: true, ratio: '4/3', gap: 'l', fx: 'zoom', art: { type: 'dark', glow: SCENES[c.scene].sky[2] }, items: [{ k: 'title', y: 36, num: n + ' / ' + N + ' · ' + u.stage, kz: c.name.kz, ru: c.name.ru }] }, 't' + n);
      if (part !== 'rest') (c.intro || []).forEach(function (p) { h += p.beat ? beatHTML(p) : p.void ? voidHTML(p) : p.art.type === 'title' ? titleHTML() : panelHTML(p, p.id); });
      if (part === 'intro') return h + '</section>';
      if (c.story) { var ci = 0; c.story.forEach(function (p) { h += p.card ? storyCardHTML(n, ci++, p) : p.beat ? beatHTML(p) : p.void ? voidHTML(p) : panelHTML(p, p.id); }); }
      else if (!c.episodes.length) {
        h += panelHTML({ id: 'd' + n, ratio: '4/5', gap: 'l', art: { type: 'dark', glow: SCENES[c.scene].sky[2] }, items: [
          { k: 'nar', x: 8, y: 34, w: 84, big: true, kz: J.ui.kz.devTitle, ru: J.ui.ru.devTitle }, { k: 'nar', x: 8, y: 60, w: 84, kz: J.ui.kz.devText, ru: J.ui.ru.devText }] }, 'd' + n);
      } else c.episodes.forEach(function (ep, k) {
        episodePanels(n, k).forEach(function (p) { h += panelHTML(p, p.id); });
        h += courseCardHTML(n, k);
      });
      (c.outro || []).forEach(function (p) { h += panelHTML(p, p.id); });
      if (courseCount(c)) h += '<div class="endc"><div class="box"><b>' + esc(u.done) + '</b><p>' + esc(u.doneText) + '</p></div></div>';
      return h + '</section>';
    }
    function gateHTML(n, passed) {
      // шлюз после главы n ведёт в главу n+1; её поле gate задаёт картинку, заголовок, вопрос и подсказку
      var u = U(), entry = n < 0, g = (!entry && CH[n + 1] && CH[n + 1].gate) || {}, T = function (k, d) { return g[k] ? (g[k][lang] || g[k]) : d; };
      var imgName = entry ? J.gateImage : T('image', ''), img = !passed && imgName && (J.images || []).indexOf(imgName) > -1;
      if (entry) u = { passed: u.passed, gateTitle: u.entryTitle, gateText: u.entryText, codePh: u.codePh, unlock: u.entryBtn };
      else u = { passed: u.passed, gateTitle: T('title', u.gateTitle), gateText: T('text', u.gateText), codePh: T('ph', u.codePh), unlock: u.unlock };
      // пройденный шлюз — узкий разделитель с золотой чертой, без тумана и замка
      if (passed) return '<section class="chap gatep passed" data-ch="' + Math.max(0, n) + '" data-gate="' + n + '"><div class="in"><i class="gl"></i><h3>' + esc(u.passed) + '</h3><i class="gl"></i></div></section>';
      return '<section class="chap gatep' + (img ? ' img' : '') + '" data-ch="' + Math.max(0, n) + '" data-gate="' + n + '"' + (img ? ' style="--gimg:url(' + J.imgDir + imgName + '.' + J.imgExt + ')"' : '') + '><i class="fb"></i><i class="fb"></i><i class="fb"></i><i class="fb"></i><i class="fb"></i><div class="in">' + lockSVG(false) +
        ('<h3>' + esc(u.gateTitle) + '</h3><p>' + esc(u.gateText) + '</p><form novalidate><input id="codeIn" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="12" placeholder="' + esc(u.codePh) + '" aria-label="' + esc(u.codePh) + '"><button class="btn" type="submit">' + esc(u.unlock) + '</button></form><div class="err" role="alert"></div>') + '</div></section>';
    }
    function render() {
      var u = U(), h = '';
      imgList = [];
      // пролог виден всем; после него шлюз 0 (код входа), затем глава 0
      h += chapterHTML(0, 'intro') + gateHTML(-1, entered);
      if (entered) h += chapterHTML(0, 'rest') + gateHTML(0, opened > 0);
      for (var n = 1; entered && n <= opened; n++) {
        h += chapterHTML(n);
        // после главы без содержимого («Продолжение следует…») шлюз не показываем: история пока кончается здесь
        if (n < N && (CH[n].story || CH[n].episodes.length)) h += gateHTML(n, n < opened);
      }
      if (entered && opened === N) {
        var f = J.finale, e = U();
        h += '<section class="chap" data-ch="' + N + '">' + panelHTML(f, 'end') + '<div class="finalep"><h2>' + esc(e.endTitle) + '</h2><p>' + esc(e.endText) + '</p><button class="link" id="restartBtn">' + esc(e.restart) + '</button></div></section>';
      }
      document.getElementById('strip').innerHTML = h;
      document.documentElement.lang = lang === 'ru' ? 'ru' : 'kk';
      document.getElementById('langSel').value = lang;
      document.title = u.title + ' · SMB';
      attachImages(); observe(); renderHud(); onScroll();
    }

    /* ---------- готовые картинки: файл в img/ заменяет временный рисунок ---------- */
    var imgOk = {}, imgOf = {};
    function attachImages() {
      imgList.forEach(function (id) {
        var name = imgOf[id] || id;
        if ((J.images || []).indexOf(name) < 0) return;
        var url = J.imgDir + name + '.' + J.imgExt;
        function put() { var el = document.querySelector('.panel[data-id="' + id + '"] .art'); if (el) el.innerHTML = '<img src="' + url + '" alt="">'; }
        if (imgOk[id] === true) { put(); return; }
        if (imgOk[id] === false) return;
        var im = new Image(); im.onload = function () { imgOk[id] = true; put(); }; im.onerror = function () { imgOk[id] = false; }; im.src = url;
      });
    }

    /* ---------- верхняя панель ---------- */
    var curCh = 0;
    function renderHud() {
      var u = U(), h = '';
      document.getElementById('brand').textContent = u.title;
      for (var i = 0; i <= N; i++) {
        var op = entered && i <= opened;
        h += '<button class="node' + (op ? ' open' : '') + (i === curCh ? ' cur' : '') + '" data-i="' + i + '" ' + (op ? 'style="--c:' + SCENES[CH[i].scene].sky[2] + '" title="' + esc(CH[i].name[lang]) + '"' : 'tabindex="-1" aria-disabled="true" title="' + esc(u.unknown) + '"') + '>' + (op ? i : '?') + '</button>';
      }
      document.getElementById('nodes').innerHTML = h;
      renderProg();
    }
    // Полоска прогресса по курсам главы (как квадраты ⬛🔲 в папках Drive)
    function renderProg() {
      var el = document.getElementById('prog'), c = CH[curCh];
      var total = c ? courseCount(c) : 0;
      if (!entered || !total) { el.style.display = 'none'; return; }   // в прологе курсов ещё нет
      var sq = '', cnt = 0;
      for (var k = 0; k < total; k++) { var on = done.indexOf(curCh + '-' + k) > -1; if (on) cnt++; sq += '<i class="' + (on ? 'on' : '') + '"></i>'; }
      el.innerHTML = '<span>' + esc(U().progress) + '</span>' + sq + '<b>' + cnt + '/' + total + '</b>';
      el.style.display = 'flex';
    }
    function goChapter(n) { var sec = document.querySelector('.chap[data-ch="' + n + '"]'); if (sec) window.scrollTo({ top: sec.offsetTop, behavior: reduce ? 'auto' : 'smooth' }); }
    document.getElementById('nodes').addEventListener('click', function (e) { var b = e.target.closest('.node.open'); if (b) goChapter(+b.dataset.i); });

    /* ---------- появление кадров и движение при скролле ---------- */
    var io = null;
    function observe() {
      if (io) io.disconnect();
      io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }); }, { threshold: 0.18 });
      document.querySelectorAll('.panel').forEach(function (p) { io.observe(p); });
    }
    var ticking = false;
    function onScroll() { if (ticking) return; ticking = true; requestAnimationFrame(function () { ticking = false; sync(); }); }
    function sync() {
      var vh = window.innerHeight, y = window.scrollY, docH = document.documentElement.scrollHeight - vh;
      document.getElementById('bar').style.width = (docH > 0 ? Math.min(100, y / docH * 100) : 0) + '%';
      if (!reduce) document.querySelectorAll('.panel[data-id]').forEach(function (p) {
        var r = p.getBoundingClientRect(); if (r.bottom < -50 || r.top > vh + 50) return;
        var art = p.querySelector('.art'); if (!art) return;
        var t = (r.top + r.height / 2 - vh / 2) / vh;
        // готовая картинка: лёгкий сдвиг без обрезки краёв; временный рисунок: прежний сильный параллакс
        if (art.querySelector('img')) art.style.transform = 'translateY(' + (t * -1.6).toFixed(2) + '%) scale(' + (p.dataset.zoom ? 1.04 + (0.6 - t) * 0.06 : 1.04).toFixed(3) + ')';
        else art.style.transform = 'translateY(' + (t * -5).toFixed(2) + '%) scale(' + (p.dataset.zoom ? 1.02 + (0.6 - t) * 0.1 : 1.01).toFixed(3) + ')';
      });
      var secs = document.querySelectorAll('#strip > .chap'), ch = 0;
      for (var i = 0; i < secs.length; i++) if (secs[i].getBoundingClientRect().top <= vh / 2) ch = +secs[i].dataset.ch;
      if (ch !== curCh) { curCh = ch; renderHud(); }   // фон страницы всегда тёмный: светлые палитры старых сцен мешали читать текст
    }

    /* ---------- коды ---------- */
    async function sha256(s) { var b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return Array.prototype.map.call(new Uint8Array(b), function (x) { return x.toString(16).padStart(2, '0'); }).join(''); }
    // Варианты кода из ввода: 8 латинских знаков → XXXX-XXXX (коды-пароли); слово кириллицей/латиницей → как есть, заглавными (коды-ответы)
    function codeCandidates(v) {
      var up = String(v).toUpperCase(), out = [], latin = up.replace(/[^A-Z0-9]/g, ''), word = up.replace(/[^A-ZА-ЯЁӘҒҚҢӨҰҮҺІ0-9]/g, '');
      if (latin.length === 8) out.push(latin.slice(0, 4) + '-' + latin.slice(4));
      if (word.length >= 3 && out.indexOf(word) < 0) out.push(word);
      return out;
    }
    var fails = 0, cooldownUntil = 0;
    async function tryUnlock(form) {
      var u = U(), gate = form.closest('.gatep'), err = gate.querySelector('.err'), lockEl = gate.querySelector('.lock'), cands = codeCandidates(form.querySelector('input').value);
      var next = entered ? opened + 1 : 0, g = (entered && CH[next].gate) || {};
      var wrong = !entered && u.entryWrong ? u.entryWrong : (g.wrong ? g.wrong[lang] : u.wrong);
      if (Date.now() < cooldownUntil) { err.textContent = wrong; return; }
      if (!(window.crypto && crypto.subtle)) { err.textContent = u.nocrypto; return; }
      var ok = false, hs = [].concat(CH[next].hash);   // hash главы — строка или список допустимых отпечатков
      for (var i = 0; i < cands.length && !ok; i++) ok = hs.indexOf(await sha256('smb-journey:' + next + ':' + cands[i])) > -1;
      if (!ok) { fails++; if (fails >= 5) { cooldownUntil = Date.now() + 10000; fails = 0; } err.textContent = wrong; lockEl.classList.remove('shake'); void lockEl.getBBox; lockEl.classList.add('shake'); return; }
      err.textContent = ''; form.querySelector('button').disabled = true; form.querySelector('input').disabled = true;
      lockEl.classList.add('open');
      setTimeout(function () { gate.classList.add('parting'); var f = document.getElementById('flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go'); }, reduce ? 0 : 700);
      setTimeout(function () { var first = !entered; if (entered) opened = next; else entered = true; saveOpened(opened); render(); if (first) { var r = document.getElementById('chapRest'); if (r) window.scrollTo({ top: r.offsetTop, behavior: reduce ? 'auto' : 'smooth' }); } else goChapter(opened); }, reduce ? 200 : 1900);
    }
    // Окно «история пишется» для порталов без ссылки
    var modal = document.getElementById('modal');
    function openModal(title, text) { modal.querySelector('h3').textContent = title; modal.querySelector('p').textContent = text; modal.querySelector('.mx').setAttribute('aria-label', U().close); modal.hidden = false; }
    modal.addEventListener('click', function (e) { if (e.target === modal || e.target.closest('.mx')) modal.hidden = true; });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') modal.hidden = true; });
    var strip = document.getElementById('strip');
    strip.addEventListener('submit', function (e) { if (e.target.closest('.gatep')) { e.preventDefault(); tryUnlock(e.target); } });
    strip.addEventListener('click', function (e) {
      var chk = e.target.closest('.chk'), sb = e.target.closest('.story');
      if (sb) { openModal(sb.dataset.title, U().storySoon); return; }
      if (chk) {
        var key = chk.dataset.key, at = done.indexOf(key);
        if (at > -1) done.splice(at, 1); else done.push(key);
        saveDone(); chk.classList.toggle('on', at < 0); chk.textContent = at < 0 ? U().isDone : U().markDone; renderProg();
      } else if (e.target.id === 'restartBtn') { if (confirm(U().restartAsk)) { opened = 0; entered = false; done = []; saveOpened(0); saveDone(); render(); window.scrollTo(0, 0); } }
    });
    document.getElementById('langSel').addEventListener('change', function (e) { lang = e.target.value === 'ru' ? 'ru' : 'kz'; try { localStorage.setItem(LANG_KEY, lang); } catch (x) {} render(); });
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll);
    render();
  })();
  </script>
