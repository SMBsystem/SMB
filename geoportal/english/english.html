<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <!-- COURSE ACCESS GUARD: вход только по коду курса English -->
  <style id="authCloak">body { display: none !important; }</style>
  <script>
    (function () {
      try {
        var isAdmin = localStorage.getItem('geotany_admin_auth') === 'true';
        var ok = isAdmin;
        var s = null;
        try { s = JSON.parse(localStorage.getItem('geotany_user_session') || 'null'); } catch (e) {}
        if (s && s.v === 2 && (s.exp || 0) > Date.now() && s.email && s.courseId === 'english') ok = true;
        if (!ok) { window.location.replace('../index.html?need_course=english&redirect=english/english.html'); return; }
        var cloak = document.getElementById('authCloak');
        if (cloak) cloak.remove();
      } catch (err) { window.location.replace('../index.html'); }
    })();
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <title>English — универсальный курс английского языка</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../smb-config.js"></script>
  <script src="../smb-common.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: {
        brand: { 50: '#ecfdf5', 100: '#d1fae5', 400: '#34d399', 500: '#10b981', 600: '#059669', 700: '#047857', 800: '#065f46', 900: '#064e3b' },
        space: { 800: '#1e293b', 850: '#151e2e', 900: '#0f172a', 950: '#090d16' }
      } } }
    };
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #090d16; overflow-x: hidden; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; overflow-x: hidden; max-width: 100%; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    .touch-scroll { -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .touch-scroll::-webkit-scrollbar { display: none; }
    @media screen and (max-width: 768px) { input, select, textarea { font-size: 16px !important; } }
    @media (max-width: 639px) { #headerBadge { display: none !important; } #langSelect { max-width: 74px; } }

    /* ===== общий вид разделов (как в GeoTany) ===== */
    .ac-emerald { --ac: 52, 211, 153; } .ac-cyan { --ac: 34, 211, 238; } .ac-violet { --ac: 167, 139, 250; }
    .ac-amber { --ac: 251, 191, 36; } .ac-teal { --ac: 45, 212, 191; } .ac-red { --ac: 248, 113, 113; } .ac-sky { --ac: 56, 189, 248; }
    .sec-bar { background: linear-gradient(180deg, #111a2e 0%, #0f172a 100%); border: 1px solid #1e293b; border-radius: 1.1rem; padding: 1rem; box-shadow: 0 10px 30px -18px rgba(0,0,0,.8); }
    @media (min-width: 640px) { .sec-bar { padding: 1.15rem 1.25rem; } }
    .sec-head { display: flex; flex-direction: column; gap: .9rem; }
    @media (min-width: 1024px) { .sec-head { flex-direction: row; align-items: center; } }
    .sec-info { display: flex; align-items: center; gap: .8rem; min-width: 0; flex: 1; }
    .sec-ico { width: 2.75rem; height: 2.75rem; border-radius: .9rem; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; background: rgba(var(--ac), .13); border: 1px solid rgba(var(--ac), .35); }
    .sec-title { font-size: .95rem; font-weight: 800; color: #fff; line-height: 1.25; }
    .sec-sub { font-size: .75rem; color: #94a3b8; margin-top: .15rem; line-height: 1.45; }
    .sec-tools { display: flex; flex-direction: column; gap: .6rem; width: 100%; }
    @media (min-width: 640px) { .sec-tools { flex-direction: row; align-items: stretch; } }
    @media (min-width: 1024px) { .sec-tools { width: auto; flex-shrink: 0; } }
    .sec-search { position: relative; flex: 1; min-width: 0; }
    @media (min-width: 1024px) { .sec-search { width: 16rem; flex: none; } }
    .sec-search span { position: absolute; left: .9rem; top: 50%; transform: translateY(-50%); display: flex; color: #64748b; pointer-events: none; }
    .sec-search span svg { width: 1rem; height: 1rem; }
    .sec-search input { width: 100%; height: 100%; min-height: 3.1rem; padding: .6rem .9rem .6rem 2.5rem; background: #0a1020; border: 1px solid #263248; border-radius: .9rem; font-size: .82rem; color: #f1f5f9; outline: none; }
    .sec-search input::placeholder { color: #64748b; }
    .sec-search input:focus { border-color: rgba(var(--ac), .7); box-shadow: 0 0 0 3px rgba(var(--ac), .15); }
    .sec-track { min-width: 13.5rem; min-height: 3.1rem; padding: .5rem .9rem .55rem; background: #0a1020; border: 1px solid #263248; border-radius: .9rem; display: flex; flex-direction: column; justify-content: center; gap: .4rem; }
    .sec-track-top { display: flex; align-items: baseline; justify-content: space-between; gap: .75rem; white-space: nowrap; }
    .sec-track-num { font-size: 1rem; font-weight: 900; color: #fff; font-variant-numeric: tabular-nums; line-height: 1; }
    .sec-track-num small { font-size: .78rem; font-weight: 700; color: #64748b; margin-left: .15rem; }
    .sec-track-lbl { font-size: .7rem; font-weight: 600; color: #94a3b8; margin-left: .35rem; }
    .sec-track-pct { font-size: .74rem; font-weight: 800; color: rgb(var(--ac)); }
    .sec-track-bar { height: 4px; border-radius: 9px; background: #1e293b; overflow: hidden; }
    .sec-track-bar i { display: block; height: 100%; border-radius: 9px; background: linear-gradient(90deg, rgba(var(--ac), .65), rgb(var(--ac))); transition: width .4s; }
    .sec-pills { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .9rem; padding-top: .9rem; border-top: 1px solid #1e293b; }
    @media (max-width: 639px) { .sec-pills { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-left: -1rem; margin-right: -1rem; padding-left: 1rem; padding-right: 1rem; } .sec-pills::-webkit-scrollbar { display: none; } .chip-btn { flex-shrink: 0; } }
    .chip-btn { padding: .42rem .8rem; border-radius: .7rem; font-size: .74rem; font-weight: 700; white-space: nowrap; color: #94a3b8; background: #151e2e; border: 1px solid #263248; transition: all .15s; }
    .chip-btn:hover { color: #fff; border-color: #475569; }
    .chip-btn.on { color: #0b0f19; background: rgb(var(--ac)); border-color: rgb(var(--ac)); font-weight: 800; box-shadow: 0 6px 18px -8px rgba(var(--ac), .8); }
    .chip-btn[disabled] { opacity: .45; cursor: not-allowed; }
    .gc { position: relative; display: flex; flex-direction: column; gap: .8rem; padding: 1.05rem; border-radius: 1.1rem; background: linear-gradient(180deg, #111a2e 0%, #0c1322 100%); border: 1px solid #1e293b; transition: transform .18s, border-color .18s, box-shadow .18s; }
    .gc:hover { transform: translateY(-2px); border-color: rgba(var(--ac), .55); box-shadow: 0 14px 34px -16px rgba(var(--ac), .45); }
    .gc.done { border-color: rgba(52, 211, 153, .5); }
    .gc-top { display: flex; align-items: flex-start; gap: .75rem; }
    .gc-num { width: 2.6rem; height: 2.6rem; border-radius: .85rem; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: .95rem; color: rgb(var(--ac)); background: rgba(var(--ac), .13); border: 1px solid rgba(var(--ac), .35); }
    .gc.done .gc-num { color: #34d399; background: rgba(52, 211, 153, .14); border-color: rgba(52, 211, 153, .4); }
    .gc-kicker { font-size: .66rem; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; color: rgb(var(--ac)); }
    .gc-title { font-size: .95rem; font-weight: 800; color: #fff; line-height: 1.3; margin-top: .1rem; }
    .gc-sub { font-size: .75rem; color: #94a3b8; line-height: 1.5; }
    .gc-status { flex-shrink: 0; font-size: .66rem; font-weight: 800; padding: .2rem .55rem; border-radius: 999px; color: #6ee7b7; background: rgba(52, 211, 153, .14); border: 1px solid rgba(52, 211, 153, .35); white-space: nowrap; }
    .gc-status.warn { color: #fcd34d; background: rgba(251, 191, 36, .14); border-color: rgba(251, 191, 36, .35); }
    .gc-tags { display: flex; flex-wrap: wrap; gap: .3rem; }
    .gc-tag { font-size: .66rem; color: #94a3b8; background: #0a1020; border: 1px solid #1e293b; border-radius: .45rem; padding: .12rem .45rem; }
    .gc-bar { height: 5px; border-radius: 9px; background: #1e293b; overflow: hidden; }
    .gc-bar i { display: block; height: 100%; border-radius: 9px; background: rgb(var(--ac)); }
    .gc-foot { margin-top: auto; display: flex; align-items: center; gap: .45rem; padding-top: .8rem; border-top: 1px solid #1e293b; }
    .gc-btn { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: .4rem; padding: .6rem .8rem; border-radius: .75rem; font-size: .78rem; font-weight: 800; color: #0b0f19; background: rgb(var(--ac)); transition: filter .15s; white-space: nowrap; cursor: pointer; border: 0; }
    .gc-btn:hover { filter: brightness(1.1); }
    .gc-btn2 { flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; gap: .3rem; padding: .6rem .75rem; border-radius: .75rem; font-size: .76rem; font-weight: 800; color: rgb(var(--ac)); background: rgba(var(--ac), .1); border: 1px solid rgba(var(--ac), .32); white-space: nowrap; cursor: pointer; }
    .gc-btn2:hover { background: rgba(var(--ac), .2); }
    .sec-empty { grid-column: 1 / -1; text-align: center; padding: 2.5rem 1rem; color: #64748b; font-size: .85rem; border: 1px dashed #263248; border-radius: 1rem; }

    /* точки навыков на карточке урока */
    .dots { display: flex; gap: .3rem; flex-wrap: wrap; }
    .dot { display: inline-flex; align-items: center; gap: .2rem; font-size: .68rem; font-weight: 700; padding: .15rem .45rem; border-radius: .5rem; background: #0a1020; border: 1px solid #1e293b; color: #64748b; }
    .dot.on { color: #6ee7b7; border-color: rgba(52, 211, 153, .45); background: rgba(52, 211, 153, .1); }

    /* ===== окно урока ===== */
    #lessonView { background: #090d16; }
    .lv-card { background: linear-gradient(180deg, #111a2e 0%, #0c1322 100%); border: 1px solid #1e293b; border-radius: 1.1rem; padding: 1rem; }
    @media (min-width: 640px) { .lv-card { padding: 1.25rem; } }
    .lv-h { font-weight: 800; color: #fff; font-size: .95rem; }
    .lv-p { color: #cbd5e1; font-size: .85rem; line-height: 1.65; }
    .lv-muted { color: #94a3b8; font-size: .75rem; }
    .wordrow { display: grid; grid-template-columns: 2.2rem 1fr; gap: .6rem; align-items: start; padding: .6rem .2rem; border-bottom: 1px solid #1e293b; }
    .wordrow:last-child { border-bottom: 0; }
    .spk { width: 2.1rem; height: 2.1rem; border-radius: .65rem; display: inline-flex; align-items: center; justify-content: center; background: rgba(34, 211, 238, .12); border: 1px solid rgba(34, 211, 238, .35); color: #67e8f9; cursor: pointer; font-size: .9rem; flex-shrink: 0; }
    .spk:hover { background: rgba(34, 211, 238, .22); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; padding: .6rem 1rem; border-radius: .8rem; font-size: .8rem; font-weight: 800; transition: filter .15s; cursor: pointer; border: 0; }
    .btn-primary { background: #10b981; color: #04120d; } .btn-primary:hover { filter: brightness(1.08); }
    .btn-ghost { background: #151e2e; color: #cbd5e1; border: 1px solid #263248; } .btn-ghost:hover { color: #fff; border-color: #475569; }
    .btn[disabled] { opacity: .5; cursor: not-allowed; }
    .qbox { padding: .8rem .9rem; border-radius: .9rem; background: #0a1020; border: 1px solid #1e293b; }
    .qbox label { display: flex; gap: .5rem; align-items: flex-start; padding: .3rem .1rem; font-size: .83rem; color: #e2e8f0; cursor: pointer; }
    .qbox input[type=radio] { margin-top: .25rem; accent-color: #10b981; }
    .qfb { margin-top: .5rem; font-size: .75rem; line-height: 1.5; border-radius: .6rem; padding: .45rem .65rem; }
    .qfb.ok { background: rgba(52, 211, 153, .12); color: #6ee7b7; } .qfb.bad { background: rgba(248, 113, 113, .12); color: #fca5a5; }
    .tx { width: 100%; min-height: 10rem; background: #0a1020; border: 1px solid #263248; border-radius: .9rem; padding: .8rem .9rem; color: #f1f5f9; font-size: .88rem; line-height: 1.6; outline: none; }
    .tx:focus { border-color: rgba(52, 211, 153, .7); box-shadow: 0 0 0 3px rgba(52, 211, 153, .15); }
    .chk { display: flex; gap: .5rem; align-items: center; font-size: .78rem; color: #94a3b8; padding: .2rem 0; }
    .chk.ok { color: #6ee7b7; }
    .line-active { background: rgba(34, 211, 238, .12); border-radius: .6rem; }
    .toast { position: fixed; left: 50%; bottom: 1.5rem; transform: translateX(-50%); z-index: 300; padding: .6rem 1rem; border-radius: .9rem; background: #111a2e; border: 1px solid #334155; color: #fff; font-size: .8rem; font-weight: 700; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
    .xp-pop { position: fixed; z-index: 400; pointer-events: none; font-weight: 900; color: #fbbf24; font-size: 1.4rem; text-shadow: 0 0 12px rgba(251,191,36,.8); animation: xpf 1.1s ease-out forwards; }
    @keyframes xpf { 0% { opacity: 0; transform: translateY(8px) scale(.8); } 25% { opacity: 1; transform: translateY(-6px) scale(1.15); } 100% { opacity: 0; transform: translateY(-46px); } }
    @supports (padding-bottom: env(safe-area-inset-bottom)) { main { padding-bottom: calc(env(safe-area-inset-bottom) + 6rem) !important; } }
  </style>
</head>
<body class="bg-space-950 text-slate-100 min-h-screen flex flex-col selection:bg-brand-500 selection:text-white">

  <header class="sticky top-0 z-50 bg-space-900/95 backdrop-blur-md border-b border-slate-800/80">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 h-14 sm:h-16 flex items-center justify-between gap-1.5 sm:gap-4">
      <div class="flex items-center space-x-2.5 sm:space-x-3.5 shrink-0">
        <a href="#" onclick="ENG.go('path'); return false;" class="flex items-center space-x-2 shrink-0 hover:opacity-95 transition">
          <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-tr from-sky-600 to-brand-500 flex items-center justify-center shadow-lg shadow-sky-500/25 shrink-0"><span class="text-sm sm:text-xl">🇬🇧</span></div>
          <span class="hidden sm:inline font-extrabold text-base sm:text-xl tracking-tight text-white">English<span class="text-brand-400">Hub</span></span>
        </a>
        <div class="h-4 w-px bg-slate-800 hidden sm:block"></div>
        <a href="../index.html" class="inline-flex items-center space-x-1.5 px-2.5 sm:px-3 py-1 sm:py-1.5 rounded-xl bg-space-850 hover:bg-space-800 text-slate-300 hover:text-white border border-slate-700 text-xs font-bold transition">
          <span>🧭</span><span class="hidden sm:inline">SMB Portal</span>
        </a>
      </div>
      <div class="flex items-center space-x-1.5 sm:space-x-3 shrink-0">
        <div class="hidden sm:flex items-center space-x-1 bg-space-850 px-3 py-1.5 rounded-xl border border-slate-700/60">
          <span class="text-amber-400">🔥</span><span class="text-xs font-bold text-amber-300 leading-none" id="hudStreak">1</span>
        </div>
        <div class="flex items-center space-x-1 bg-space-850 px-2 sm:px-3.5 py-1 sm:py-1.5 rounded-xl border border-amber-500/40">
          <span class="text-amber-400 text-xs sm:text-sm">⚡</span><span class="text-[11px] sm:text-xs font-black text-amber-300 leading-none" id="hudXp">0 XP</span>
        </div>
        <span id="headerBadge" class="text-[11px] font-mono font-black px-2.5 py-1 rounded-xl bg-sky-500/15 text-sky-300 border border-sky-500/30">📚 English A1–C1</span>
        <a href="../gate.html?c=ielts" id="ieltsLink" class="hidden md:flex px-3 py-1.5 rounded-xl bg-violet-500/15 hover:bg-violet-500/25 text-violet-300 font-extrabold text-xs border border-violet-500/40 items-center space-x-1"><span>🎓</span><span>IELTS ↗</span></a>
        <button onclick="ENG.logout()" id="logoutBtn" title="Выйти" class="px-2 sm:px-2.5 py-1 sm:py-1.5 rounded-xl bg-space-850 hover:bg-rose-500/20 text-slate-400 hover:text-rose-300 text-xs font-bold border border-slate-700/80 transition flex items-center space-x-1 shrink-0"><span>🚪</span></button>
        <select id="langSelect" onchange="ENG.setLang(this.value)" class="bg-space-850 text-xs text-slate-200 border border-slate-700 rounded-xl px-2 py-1 sm:py-1.5 focus:outline-none focus:border-brand-500 font-bold cursor-pointer">
          <option value="ru">🇷🇺 RU</option>
          <option value="kz">🇰🇿 KZ</option>
        </select>
      </div>
    </div>
    <div class="border-t border-slate-800 bg-space-950/95 sticky top-14 sm:top-16 z-40 backdrop-blur-md">
      <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 flex space-x-2 overflow-x-auto py-2 touch-scroll scroll-smooth" id="partNav"></div>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-6 lg:px-8 py-3 sm:py-5 space-y-3 sm:space-y-5 pb-24 sm:pb-20">
    <!-- баннер раздела -->
    <div class="bg-gradient-to-r from-space-900 via-space-850 to-space-900 border border-slate-800/90 rounded-2xl sm:rounded-3xl p-3 sm:p-5 shadow-xl flex items-center gap-3 sm:gap-4">
      <div class="w-9 h-9 sm:w-12 sm:h-12 rounded-xl bg-brand-500/20 text-brand-400 border border-brand-500/30 flex items-center justify-center text-lg sm:text-2xl shrink-0" id="bnIcon">🧭</div>
      <div class="min-w-0 flex-1">
        <span class="text-[9px] sm:text-[10px] font-extrabold uppercase tracking-widest text-brand-400" id="bnBadge"></span>
        <h1 class="text-sm sm:text-xl font-black text-white mt-0.5 leading-snug" id="bnTitle"></h1>
        <p class="text-[11px] sm:text-xs text-slate-400 mt-0.5 leading-relaxed" id="bnDesc"></p>
      </div>
    </div>

    <!-- панель: уровень, поиск, прогресс -->
    <div class="sec-bar ac-sky" id="barBox">
      <div class="sec-head">
        <div class="sec-info">
          <div class="sec-ico" id="barIcon">🧭</div>
          <div class="min-w-0"><h3 class="sec-title" id="barTitle"></h3><p class="sec-sub" id="barSub"></p></div>
        </div>
        <div class="sec-tools">
          <label class="sec-search"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span>
            <input type="text" id="searchInput" oninput="ENG.render()" placeholder="">
          </label>
          <div class="sec-track" id="track"></div>
        </div>
      </div>
      <div class="sec-pills" id="levelChips"></div>
    </div>

    <div id="content" class="space-y-4"></div>
    <p id="note" class="text-[11px] text-slate-500 leading-relaxed px-1"></p>
  </main>

  <!-- окно урока -->
  <div id="lessonView" class="hidden fixed inset-0 z-[100] overflow-y-auto">
    <div class="sticky top-0 z-10 bg-space-900/95 backdrop-blur-md border-b border-slate-800">
      <div class="max-w-4xl mx-auto px-3 sm:px-6 py-2.5 flex items-center gap-3">
        <button class="btn btn-ghost" onclick="ENG.closeLesson()">←</button>
        <div class="min-w-0 flex-1">
          <div class="text-[10px] font-extrabold uppercase tracking-widest text-brand-400" id="lvKicker"></div>
          <div class="font-black text-white leading-tight truncate" id="lvTitle"></div>
        </div>
        <button class="btn btn-ghost" id="lvPrev" onclick="ENG.stepLesson(-1)">‹</button>
        <button class="btn btn-ghost" id="lvNext" onclick="ENG.stepLesson(1)">›</button>
      </div>
      <div class="max-w-4xl mx-auto px-3 sm:px-6 pb-2 flex gap-1.5 overflow-x-auto touch-scroll" id="lvTabs"></div>
    </div>
    <div class="max-w-4xl mx-auto px-3 sm:px-6 py-4 pb-24 space-y-4" id="lvBody"></div>
  </div>

  <div id="toastBox"></div>

  <script src="data/lessons-a1-1.js"></script>
  <script src="data/lessons-a1-2.js"></script>
  <script src="data/placement.js"></script>
  <script src="english.js"></script>
</body>
</html>
